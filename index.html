                    <div style={{ border:'1.5px solid var(--line)', borderRadius:14, background:'#FBFCFF', maxHeight:210, overflowY:'auto' }}>
                      <label style={{ display:'flex', alignItems:'center', gap:9, padding:'10px 13px', borderBottom:'1px solid var(--line)', cursor:'pointer', fontSize:13, fontWeight:600 }}>
                        <input type="checkbox" checked={bulkStudentAll} onChange={toggleBulkAll} style={{ width:16, height:16, accentColor:'var(--indigo)' }} />
                        Select all
                      </label>
                      {[...students].sort((a,b) => rollCompare(a.roll_no, b.roll_no)).map(s => (
                        <label
                          key={s.id}
                          style={{ display:'flex', alignItems:'center', gap:9, padding:'9px 13px', borderBottom:'1px solid var(--line)', cursor:'pointer', fontSize:13, background: bulkSelected[s.id] ? 'var(--indigo-tint)' : 'transparent' }}
                        >
                          <input
                            type="checkbox"
                            checked={!!bulkSelected[s.id]}
                            onChange={() => toggleBulkStudent(s.id)}
                            style={{ width:16, height:16, accentColor:'var(--indigo)' }}
                          />
                          <span style={{ flex:1 }}>
                            <span style={{ fontWeight:600 }}>{s.roll_no} – {s.name}</span>
                          </span>
                          {bulkSelected[s.id] && <Icon name="check" style={{ width:14, height:14, color:'var(--indigo-deep)' }} />}
                        </label>
                      ))}
                    </div>
                  </div>
                  <div className="field">
                    <label>Status to apply</label>
                    <select value={bulkStatus} onChange={e => setBulkStatus(e.target.value)}>
                      <option value="present">Present</option>
                      <option value="absent">Absent</option>
                      <option value="od">OD (On Duty)</option>
                      <option value="unmark">Not Marked</option>
                    </select>
                  </div>
                  <div style={{ fontSize:11, color:'var(--ink-soft)', marginBottom:12 }}>
                    {`Applies ${BULK_LABELS[bulkStatus]} to every date from ${formatDisplayDate(bulkFrom)} through ${formatDisplayDate(bulkTo)}, inclusive, for the selected students — overwriting any Present/Absent/OD already recorded. Declared holidays are skipped.`}
                  </div>
                  <button
                    className={bulkStatus === 'unmark' ? 'btn btn-danger-outline' : 'btn btn-primary'}
                    style={{ width:'100%', ...(bulkStatus === 'unmark' ? { padding: '13px 18px', fontSize: 14.5 } : {}) }}
                    onClick={handleBulkMark}
                    disabled={bulkRunning}
                  >
                    {bulkRunning ? 'Applying…' : 'Apply Bulk Mark'}
                  </button>
                </div>
              )}

              {(() => {
                if (markDateHoliday){
                  return (
                    <div className="card" style={{ textAlign:'center', padding:'32px 20px' }}>
                      <div className="glyph" style={{ marginBottom:12 }}><Icon name="calendar" /></div>
                      <div style={{ fontFamily:'Sora, sans-serif', fontWeight:700, fontSize:16, marginBottom:6 }}>{formatDisplayDate(markDate)} is a holiday</div>
                      <div style={{ fontSize:13, color:'var(--ink-soft)' }}>{markDateHoliday.reason}</div>
                      <div style={{ fontSize:11.5, color:'var(--ink-faint)', marginTop:10 }}>Attendance marking is disabled for holidays</div>
                    </div>
                  );
                }
                if (markLoading) return <div className="spinner"></div>;
                if (students.length === 0){
                  return (
                    <div className="empty-state">
                      <div className="glyph"><Icon name="cap" /></div>
                      <p>No students yet</p>
                    </div>
                  );
                }
                return (
                  <div style={{ display:'grid', gridTemplateColumns:'repeat(2, 1fr)', gap:10 }}>
                    {[...students].sort((a,b) => rollCompare(a.roll_no, b.roll_no)).map((s, i) => (
                      <SessionStudentTile
                        key={s.id} student={s} record={markRecordMap[s.id]} index={i}
                        onMarkSession={markSession}
                      />
                    ))}
                  </div>
                );
              })()}
            </div>
          )}

          {tab === 'users' && (
            <div>
              <div className="section-head">
                <h2>All Users <span className="count">{users.length}</span></h2>
                <button className="btn btn-outline" style={{ padding:'7px 12px', fontSize:12.5 }} onClick={() => setAddUserOpen(true)}>
                  <Icon name="plus" /> Add
                </button>
              </div>
              {users.length === 0 ? (
                <div className="empty-state">
                  <div className="glyph"><Icon name="users" /></div>
                  <p>No users yet</p>
                </div>
              ) : (
                <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
                  {users.map(u => (
                    <div key={u.id} className="card" style={{ padding:14, marginBottom:0, display:'flex', alignItems:'center', gap:10 }}>
                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ fontSize:14, fontWeight:600, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{u.email}</div>
                        <button
                          className="count"
                          style={{ marginTop:4, display:'inline-flex', alignItems:'center', gap:4, border:'none', cursor:'pointer' }}
                          onClick={() => setRoleTarget(u)}
                        >
                          {roleLabel(u.role)}
                          <Icon name="chevronRight" style={{ width:10, height:10, transform:'rotate(90deg)' }} />
                        </button>
                      </div>
                      <button className="btn btn-outline" style={{ padding:'8px 10px', fontSize:11.5 }} onClick={() => setResetTarget(u)}>
                        <Icon name="lock" style={{ width:13, height:13 }} />
                      </button>
                      {u.id !== session.user.id && (
                        <button className="btn btn-danger-outline" onClick={() => handleDeleteUser(u)}>
                          <Icon name="trash" />
                        </button>
                      )}
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {tab === 'students' && (
            <div>
              <div className="section-head">
                <h2>All Students <span className="count">{students.length}</span></h2>
                <div style={{ display:'flex', gap:8 }}>
                  <button className="btn btn-outline" style={{ padding:'7px 12px', fontSize:12.5 }} onClick={() => exportStudentsCSV(students)}>
                    <Icon name="download" /> CSV
                  </button>
                  <button className="btn btn-outline" style={{ padding:'7px 12px', fontSize:12.5 }} onClick={() => exportStudentsPDF(students)}>
                    <Icon name="download" /> PDF
                  </button>
                  <button className="btn btn-outline" style={{ padding:'7px 12px', fontSize:12.5 }} onClick={() => setAddStudentOpen(v => !v)}>
                    <Icon name="plus" /> Add
                  </button>
                </div>
              </div>

              {addStudentOpen && (
                <div className="card">
                  <div className="row-2">
                    <div className="field">
                      <label>Name</label>
                      <input value={studentName} onChange={e => setStudentName(e.target.value)} placeholder="e.g. Aarav Mehta" />
                    </div>
                    <div className="field">
                      <label>Roll no.</label>
                      <input value={studentRoll} onChange={e => setStudentRoll(e.target.value)} placeholder="e.g. 24" />
                    </div>
                  </div>
                  <button className="btn btn-primary" style={{ width:'100%' }} onClick={handleAddStudent} disabled={savingStudent}>
                    {savingStudent ? 'Saving…' : 'Save student'}
                  </button>
                </div>
              )}

              {students.length === 0 ? (
                <div className="empty-state">
                  <div className="glyph"><Icon name="cap" /></div>
                  <p>No students yet</p>
                </div>
              ) : (
                <div style={{ display:'grid', gridTemplateColumns:'repeat(2, 1fr)', gap:10 }}>
                  {[...students].sort((a,b) => rollCompare(a.roll_no, b.roll_no)).map(s => (
                    <div key={s.id} className="card" style={{ padding:12, marginBottom:0, position:'relative' }}>
                      <div style={{ fontSize:13.5, fontWeight:600, paddingRight:20 }}>{s.name}</div>
                      <div style={{ fontSize:11, color:'var(--ink-soft)', marginTop:2 }}>Roll {s.roll_no}</div>
                      <button
                        onClick={() => handleDeleteStudent(s)}
                        style={{ position:'absolute', top:10, right:10, border:'none', background:'transparent', color:'var(--ink-faint)', cursor:'pointer' }}
                      >
                        <Icon name="trash" style={{ width:14, height:14 }} />
                      </button>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {tab === 'reports' && (
            <div>
              <div className="card">
                <div className="row-2">
                  <div className="field">
                    <label>From date</label>
                    <DatePicker value={fromDate} onChange={setFromDate} />
                  </div>
                  <div className="field">
                    <label>To date</label>
                    <DatePicker value={toDate} onChange={setToDate} />
                  </div>
                </div>
                <button className="btn btn-primary" style={{ width:'100%' }} onClick={handleGenerateReport} disabled={generating}>
                  <Icon name="calendar" />
                  {generating ? 'Generating…' : 'Generate report'}
                </button>
              </div>

              {report && (
                <div className="card">
                  <div style={{ fontFamily:'Sora, sans-serif', fontWeight:700, fontSize:15.5, marginBottom:2 }}>Attendance Report</div>
                  <div style={{ fontSize:11.5, color:'var(--ink-soft)', marginBottom:14 }}>
                    {formatDisplayDate(report.fromDate)} – {formatDisplayDate(report.toDate)} · {report.totalSessions} session{report.totalSessions === 1 ? '' : 's'}
                {report.holidaysExcluded > 0 && ` · ${report.holidaysExcluded} holiday${report.holidaysExcluded === 1 ? '' : 's'} excluded`}
                  </div>

                  {report.rows.length === 0 ? (
                    <div className="empty-state"><p>No students to report on.</p></div>
                  ) : (
                    <div style={{ overflowX:'auto' }}>
                      <table style={{ width:'100%', borderCollapse:'collapse', fontSize:12 }}>
                        <thead>
                          <tr style={{ textAlign:'left', color:'var(--ink-soft)' }}>
                            <th style={{ padding:'6px 8px' }}>Name</th>
                            <th style={{ padding:'6px 8px' }}>Roll</th>
                            <th style={{ padding:'6px 8px', textAlign:'center' }}>P</th>
                            <th style={{ padding:'6px 8px', textAlign:'center' }}>A</th>
                            <th style={{ padding:'6px 8px', textAlign:'center' }}>OD</th>
                            <th style={{ padding:'6px 8px', textAlign:'center' }}>%</th>
                          </tr>
                        </thead>
                        <tbody>
                          {report.rows.map(r => (
                            <tr key={r.id} style={{ borderTop:'1px solid var(--line)' }}>
                              <td style={{ padding:'8px', fontWeight:600 }}>{r.name}</td>
                              <td style={{ padding:'8px', color:'var(--ink-soft)' }}>{r.roll_no}</td>
                              <td style={{ padding:'8px', textAlign:'center' }}>{r.present}</td>
                              <td style={{ padding:'8px', textAlign:'center', color:'var(--red)' }}>{r.absent}</td>
                              <td style={{ padding:'8px', textAlign:'center', color:'var(--amber)' }}>{r.od}</td>
                              <td style={{ padding:'8px', textAlign:'center', fontWeight:600 }}>{r.percentage === null ? '—' : r.percentage + '%'}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}

                  <button className="btn btn-outline" style={{ width:'100%', marginTop:14 }} onClick={handleDownloadPDF} disabled={pdfBusy}>
                    <Icon name="download" />
                    {pdfBusy ? 'Preparing PDF…' : 'Download PDF'}
                  </button>
                  <button className="btn btn-outline" style={{ width:'100%', marginTop:10 }} onClick={handleDownloadExcel}>
                    <Icon name="download" />
                    Download Excel
                  </button>
                </div>
              )}
            </div>
          )}

          {tab === 'lists' && (
            <div>
              <div className="segmented" style={{ marginBottom:14 }}>
                <button className={shareFilter === 'both' ? 'active' : ''} onClick={() => setShareFilter('both')}>Both</button>
                <button className={shareFilter === 'morning' ? 'active' : ''} onClick={() => setShareFilter('morning')}>AM only</button>
                <button className={shareFilter === 'afternoon' ? 'active' : ''} onClick={() => setShareFilter('afternoon')}>PM only</button>
              </div>

              <div id="adminExportCard" style={{ background:'#fff', borderRadius:20, border:'1px solid var(--glass-border)', boxShadow:'var(--shadow-glass)', padding:18 }}>
                <div style={{ fontFamily:'Sora, sans-serif', fontWeight:700, fontSize:16 }}>Attendance Report</div>
                <div style={{ fontSize:11.5, color:'var(--ink-soft)', marginBottom:16 }}>{today_day}, {today}</div>

                {listsLoading ? <div className="spinner"></div> : (
                  <React.Fragment>
                    {shareFilter !== 'afternoon' && <SessionListBlock title="Morning" absentList={morningAbsent} odList={morningOd} />}
                    {shareFilter !== 'morning' && <SessionListBlock title="Afternoon" absentList={afternoonAbsent} odList={afternoonOd} />}
                  </React.Fragment>
                )}
              </div>

              <button className="btn btn-primary" style={{ width:'100%', marginTop:14 }} onClick={handleShareImage} disabled={sharingImg}>
                <Icon name="share" />{sharingImg ? 'Preparing image…' : 'Share as image'}
              </button>
              <button className="btn btn-outline" style={{ width:'100%', marginTop:10 }} onClick={handleShareText} disabled={sharingTxt}>
                <Icon name="file" />{sharingTxt ? 'Preparing text…' : 'Share as text'}
              </button>
            </div>
          )}

          {tab === 'holidays' && (
            <div>
              <div className="card">
                <div className="row-2">
                  <div className="field">
                    <label>Date</label>
                    <DatePicker value={holidayDate} onChange={setHolidayDate} />
                  </div>
                  <div className="field">
                    <label>Reason</label>
                    <input value={holidayReason} onChange={e => setHolidayReason(e.target.value)} placeholder="e.g. Founder's Day" />
                  </div>
                </div>
                <button className="btn btn-primary" style={{ width:'100%' }} onClick={handleAddHoliday} disabled={savingHoliday}>
                  <Icon name="calendar" />
                  {savingHoliday ? 'Saving…' : 'Declare holiday'}
                </button>
              </div>

              <div className="section-head"><h2>Declared Holidays <span className="count">{holidays.length}</span></h2></div>
              {holidays.length === 0 ? (
                <div className="empty-state">
                  <div className="glyph"><Icon name="calendar" /></div>
                  <p>No holidays declared yet</p>
                  <span>Holidays are excluded from attendance percentage</span>
                </div>
              ) : (
                <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
                  {holidays.map(h => (
                    <div key={h.id} className="card" style={{ padding:12, marginBottom:0, display:'flex', alignItems:'center', gap:10 }}>
                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ fontSize:13.5, fontWeight:600 }}>{formatDisplayDate(h.date)}</div>
                        <div style={{ fontSize:11, color:'var(--ink-soft)', marginTop:2 }}>{h.reason}</div>
                      </div>
                      <button className="btn btn-danger-outline" onClick={() => handleDeleteHoliday(h)}>
                        <Icon name="trash" />
                      </button>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {tab === 'attendance' && (
            <div>
              <div className="section-head"><h2>Recent Attendance <span className="count">{attendance.length}</span></h2></div>
              {attendance.length === 0 ? (
                <div className="empty-state">
                  <div className="glyph"><Icon name="file" /></div>
                  <p>No attendance records yet</p>
                </div>
              ) : (
                <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
                  {attendance.map(a => {
                    const tone = (a.morning_status === 'absent' || a.afternoon_status === 'absent') ? 'red'
                      : (a.morning_status === 'od' || a.afternoon_status === 'od') ? 'amber' : null;
                    const badge = (label, status) => {
                      if (!status) return null;
                      const isOd = status === 'od';
                      return (
                        <span className={"count " + (isOd ? 'amber' : 'red')} style={{ marginLeft:6 }}>
                          {label} {isOd ? 'OD' : 'Absent'}
                        </span>
                      );
                    };
                    return (
                      <div key={a.id} className="card" style={{
                        padding:12, marginBottom:0, display:'flex', alignItems:'center', gap:10,
                        background: tone === 'red' ? 'var(--red-tint)' : tone === 'amber' ? 'var(--amber-tint)' : '#fff',
                        borderColor: tone === 'red' ? 'var(--red-line)' : tone === 'amber' ? 'var(--amber-line)' : 'var(--line)'
                      }}>
                        <div style={{ flex:1, minWidth:0 }}>
                          <div style={{ fontSize:13.5, fontWeight:600 }}>{a.name}</div>
                          <div style={{ fontSize:11, color:'var(--ink-soft)', marginTop:2 }}>Roll {a.roll_no} · {formatDisplayDate(a.date)}</div>
                        </div>
                        <div style={{ display:'flex', flexDirection:'column', alignItems:'flex-end', gap:4 }}>
                          {badge('AM', a.morning_status)}
                          {badge('PM', a.afternoon_status)}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}
        </React.Fragment>
      )}

      <AddUserSheet open={addUserOpen} onClose={() => setAddUserOpen(false)} onSave={handleAddUser} />
      <ResetPasswordSheet user={resetTarget} onClose={() => setResetTarget(null)} onSave={handleResetPassword} />
      <ChangeRoleSheet user={roleTarget} onClose={() => setRoleTarget(null)} onSave={handleChangeRole} />
    </div>
  );
}

function AddUserSheet({ open, onClose, onSave }){
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [role, setRole] = useState('representative');
  const [saving, setSaving] = useState(false);

  useEffect(() => { if (open){ setEmail(''); setPassword(''); setRole('representative'); } }, [open]);

  if (!open) return null;

  const handleSave = async () => {
    if (!email.trim() || !password) return;
    setSaving(true);
    await onSave(email.trim(), password, role);
    setSaving(false);
  };

  return (
    <div style={{
      position:'fixed', inset:0, background:'rgba(20,30,60,0.4)', zIndex:60,
      display:'flex', alignItems:'flex-end', justifyContent:'center'
    }} onClick={onClose}>
      <div className="card" style={{ width:'100%', maxWidth:480, margin:0, borderRadius:'26px 26px 0 0', marginBottom:0 }} onClick={e => e.stopPropagation()}>
        <h3 style={{ fontFamily:'Sora, sans-serif', fontSize:17, fontWeight:700, margin:'4px 0 16px' }}>Add user</h3>
        <div className="field">
          <label>Email</label>
          <input type="email" placeholder="name@school.edu" value={email} onChange={e => setEmail(e.target.value)} />
        </div>
        <div className="field">
          <label>Password</label>
          <input type="password" placeholder="At least 6 characters" value={password} onChange={e => setPassword(e.target.value)} />
        </div>
        <div className="field">
          <label>Role</label>
          <select value={role} onChange={e => setRole(e.target.value)}>
            <option value="representative">Representative</option>
            <option value="teacher">Teacher</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <div style={{ display:'flex', gap:10, marginTop:6 }}>
          <button className="btn" style={{ flex:1, background:'#F1F4FC', color:'var(--ink-soft)', padding:12 }} onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" style={{ flex:1.4 }} onClick={handleSave} disabled={saving}>
            {saving ? 'Saving…' : 'Create user'}
          </button>
        </div>
      </div>
    </div>
  );
}

function ResetPasswordSheet({ user, onClose, onSave }){
  const [newPassword, setNewPassword] = useState('');
  const [saving, setSaving] = useState(false);

  useEffect(() => { setNewPassword(''); }, [user]);

  if (!user) return null;

  const handleSave = async () => {
    if (newPassword.length < 6) return;
    setSaving(true);
    await onSave(user, newPassword);
    setSaving(false);
  };

  return (
    <div style={{
      position:'fixed', inset:0, background:'rgba(20,30,60,0.4)', zIndex:60,
      display:'flex', alignItems:'flex-end', justifyContent:'center'
    }} onClick={onClose}>
      <div className="card" style={{ width:'100%', maxWidth:480, margin:0, borderRadius:'26px 26px 0 0', marginBottom:0 }} onClick={e => e.stopPropagation()}>
        <h3 style={{ fontFamily:'Sora, sans-serif', fontSize:17, fontWeight:700, margin:'4px 0 4px' }}>Reset password</h3>
        <p style={{ fontSize:12.5, color:'var(--ink-soft)', margin:'0 0 16px' }}>for {user.email}</p>
        <div className="field">
          <label>New password</label>
          <input type="password" placeholder="At least 6 characters" value={newPassword} onChange={e => setNewPassword(e.target.value)} />
        </div>
        <div style={{ display:'flex', gap:10, marginTop:6 }}>
          <button className="btn" style={{ flex:1, background:'#F1F4FC', color:'var(--ink-soft)', padding:12 }} onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" style={{ flex:1.4 }} onClick={handleSave} disabled={saving || newPassword.length < 6}>
            {saving ? 'Saving…' : 'Reset password'}
          </button>
        </div>
      </div>
    </div>
  );
}

function ChangeRoleSheet({ user, onClose, onSave }){
  const [role, setRole] = useState('representative');
  const [saving, setSaving] = useState(false);

  useEffect(() => { if (user) setRole(user.role); }, [user]);

  if (!user) return null;

  const handleSave = async () => {
    setSaving(true);
    await onSave(user, role);
    setSaving(false);
  };

  return (
    <div style={{
      position:'fixed', inset:0, background:'rgba(20,30,60,0.4)', zIndex:60,
      display:'flex', alignItems:'flex-end', justifyContent:'center'
    }} onClick={onClose}>
      <div className="card" style={{ width:'100%', maxWidth:480, margin:0, borderRadius:'26px 26px 0 0', marginBottom:0 }} onClick={e => e.stopPropagation()}>
        <h3 style={{ fontFamily:'Sora, sans-serif', fontSize:17, fontWeight:700, margin:'4px 0 4px' }}>Change role</h3>
        <p style={{ fontSize:12.5, color:'var(--ink-soft)', margin:'0 0 16px' }}>for {user.email}</p>
        <div className="field">
          <label>Role</label>
          <select value={role} onChange={e => setRole(e.target.value)}>
            <option value="representative">Representative</option>
            <option value="teacher">Teacher</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <div style={{ display:'flex', gap:10, marginTop:6 }}>
          <button className="btn" style={{ flex:1, background:'#F1F4FC', color:'var(--ink-soft)', padding:12 }} onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" style={{ flex:1.4 }} onClick={handleSave} disabled={saving || role === user.role}>
            {saving ? 'Saving…' : 'Change role'}
          </button>
        </div>
      </div>
    </div>
  );
}

function OwnPasswordSheet({ open, onClose, onSave }){
  const [newPassword, setNewPassword] = useState('');
  const [confirmPassword, setConfirmPassword] = useState('');
  const [saving, setSaving] = useState(false);

  useEffect(() => { if (open){ setNewPassword(''); setConfirmPassword(''); } }, [open]);

  if (!open) return null;

  const mismatch = confirmPassword.length > 0 && newPassword !== confirmPassword;
  const canSave = newPassword.length >= 6 && newPassword === confirmPassword;

  const handleSave = async () => {
    if (!canSave) return;
    setSaving(true);
    await onSave(newPassword);
    setSaving(false);
  };

  return (
    <div style={{
      position:'fixed', inset:0, background:'rgba(20,30,60,0.4)', zIndex:60,
      display:'flex', alignItems:'flex-end', justifyContent:'center'
    }} onClick={onClose}>
      <div className="card" style={{ width:'100%', maxWidth:480, margin:0, borderRadius:'26px 26px 0 0', marginBottom:0 }} onClick={e => e.stopPropagation()}>
        <h3 style={{ fontFamily:'Sora, sans-serif', fontSize:17, fontWeight:700, margin:'4px 0 16px' }}>Change your password</h3>
        <div className="field">
          <label>New password</label>
          <input type="password" placeholder="At least 6 characters" value={newPassword} onChange={e => setNewPassword(e.target.value)} />
        </div>
        <div className="field">
          <label>Confirm new password</label>
          <input type="password" placeholder="Re-enter password" value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)} />
          {mismatch && <div style={{ fontSize:11.5, color:'var(--red)', marginTop:6 }}>Passwords don't match</div>}
        </div>
        <div style={{ display:'flex', gap:10, marginTop:6 }}>
          <button className="btn" style={{ flex:1, background:'#F1F4FC', color:'var(--ink-soft)', padding:12 }} onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" style={{ flex:1.4 }} onClick={handleSave} disabled={saving || !canSave}>
            {saving ? 'Saving…' : 'Change password'}
          </button>
        </div>
      </div>
    </div>
  );
}
const LS_LOGIN_ATTEMPTS_KEY = 'atrk:login_attempts';
const MAX_LOGIN_ATTEMPTS = 5;
const LOCKOUT_MS = 30000;

function getLoginAttempts(){
  try{
    const raw = localStorage.getItem(LS_LOGIN_ATTEMPTS_KEY);
    return raw ? JSON.parse(raw) : { count: 0, lockUntil: 0 };
  }catch(e){ return { count: 0, lockUntil: 0 }; }
}
function setLoginAttempts(v){
  try{ localStorage.setItem(LS_LOGIN_ATTEMPTS_KEY, JSON.stringify(v)); }catch(e){}
}

const ROLE_CARDS = [
  { role: 'admin', label: 'Admin', icon: 'lock', desc: 'Full system access' },
  { role: 'teacher', label: 'Teacher', icon: 'briefcase', desc: 'Students, reports & exports' },
  { role: 'representative', label: 'Representative', icon: 'cap', desc: 'Daily attendance marking' }
];

function LoginScreen({ onLogin }){
  const [selectedRole, setSelectedRole] = useState(null);
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);
  const [lockRemaining, setLockRemaining] = useState(0);

  useEffect(() => {
    if (lockRemaining <= 0) return;
    const t = setInterval(() => {
      const { lockUntil } = getLoginAttempts();
      const remaining = Math.max(0, Math.ceil((lockUntil - Date.now()) / 1000));
      setLockRemaining(remaining);
      if (remaining <= 0) clearInterval(t);
    }, 1000);
    return () => clearInterval(t);
  }, [lockRemaining]);

  const handleSubmit = async (e) => {
    e.preventDefault();
    setError('');

    const attempts = getLoginAttempts();
    if (attempts.lockUntil > Date.now()){
      setLockRemaining(Math.ceil((attempts.lockUntil - Date.now()) / 1000));
      setError(`Too many failed attempts. Try again in ${Math.ceil((attempts.lockUntil - Date.now()) / 1000)}s.`);
      return;
    }

    if (!email.trim() || !password){
      setError('Enter both email and password.');
      return;
    }
    if (!isConfigured){
      setError('Supabase is not configured in this build.');
      return;
    }

    setLoading(true);
    const { data, error: authError } = await db.auth.signInWithPassword({
      email: email.trim(), password
    });

    if (authError){
      setLoading(false);
      const next = { count: attempts.count + 1, lockUntil: 0 };
      if (next.count >= MAX_LOGIN_ATTEMPTS){
        next.lockUntil = Date.now() + LOCKOUT_MS;
        setLockRemaining(Math.ceil(LOCKOUT_MS / 1000));
        setError(`Too many failed attempts. Try again in ${Math.ceil(LOCKOUT_MS / 1000)}s.`);
      } else {
        setError(authError.message === 'Invalid login credentials'
          ? 'Incorrect email or password.'
          : authError.message);
      }
      setLoginAttempts(next);
      return;
    }

    // Confirm this login actually belongs to the role card they picked —
    // logging in as "Teacher" with an Admin account should be rejected
    // here rather than silently landing them on the wrong dashboard.
    const { data: profile, error: profileError } = await db
      .from('atrk_profiles').select('role').eq('id', data.session.user.id).single();

    setLoading(false);

    if (profileError || !profile){
      await db.auth.signOut();
      setError('This account has no role assigned yet. Ask an admin to set one up.');
      return;
    }
    if (profile.role !== selectedRole){
      await db.auth.signOut();
      setError(`This account is registered as ${roleLabel(profile.role)}, not ${roleLabel(selectedRole)}. Use the correct login card.`);
      return;
    }

    setLoginAttempts({ count: 0, lockUntil: 0 });
    onLogin(data.session);
  };

  if (!selectedRole){
    return (
      <div className="login-wrap">
        <div className="login-card">
          <div className="login-mark"><Icon name="cap" /></div>
          <h1>Student Absentees Tracker</h1>
          <p className="sub">Choose how you're signing in</p>

          <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
            {ROLE_CARDS.map(rc => (
              <button
                key={rc.role}
                onClick={() => { setSelectedRole(rc.role); setError(''); }}
                style={{
                  display:'flex', alignItems:'center', gap:12, textAlign:'left',
                  border:'1.5px solid var(--line)', background:'#FBFCFF', borderRadius:16,
                  padding:'14px 16px', cursor:'pointer', transition:'border-color .15s ease, background .15s ease'
                }}
                onMouseEnter={e => { e.currentTarget.style.borderColor = 'var(--indigo)'; e.currentTarget.style.background = 'var(--indigo-tint)'; }}
                onMouseLeave={e => { e.currentTarget.style.borderColor = 'var(--line)'; e.currentTarget.style.background = '#FBFCFF'; }}
              >
                <span style={{
                  width:38, height:38, borderRadius:12, flex:'0 0 auto',
                  background:'linear-gradient(135deg, var(--indigo), var(--indigo-deep))',
                  color:'#fff', display:'flex', alignItems:'center', justifyContent:'center'
                }}><Icon name={rc.icon} style={{ width:18, height:18 }} /></span>
                <span style={{ flex:1 }}>
                  <div style={{ fontWeight:700, fontSize:14.5 }}>{rc.label}</div>
                </span>
                <Icon name="chevronRight" style={{ width:16, height:16, color:'var(--ink-faint)' }} />
              </button>
            ))}
          </div>
        </div>
      </div>
    );
  }

  const roleMeta = ROLE_CARDS.find(rc => rc.role === selectedRole);

  return (
    <div className="login-wrap">
      <div className="login-card">
        <div className="login-mark"><Icon name={roleMeta.icon} /></div>
        <h1>{roleMeta.label} Login</h1>
        <p className="sub">Sign in to continue</p>

        {error && <div className="login-error">{error}</div>}

        <form onSubmit={handleSubmit}>
          <div className="field">
            <label>Email</label>
            <input
              type="email" placeholder="you@school.edu" value={email}
              onChange={e => setEmail(e.target.value)} autoComplete="username"
            />
          </div>
          <div className="field">
            <label>Password</label>
            <input
              type="password" placeholder="••••••••" value={password}
              onChange={e => setPassword(e.target.value)} autoComplete="current-password"
            />
          </div>
          <button className="btn btn-primary" type="submit" disabled={loading || lockRemaining > 0} style={{ width:'100%', marginTop:6 }}>
            <Icon name="lock" />
            {lockRemaining > 0 ? `Locked (${lockRemaining}s)` : loading ? 'Signing in…' : `Sign in as ${roleMeta.label}`}
          </button>
          <button
            type="button"
            onClick={() => { setSelectedRole(null); setError(''); setEmail(''); setPassword(''); }}
            style={{ width:'100%', marginTop:10, background:'transparent', border:'none', color:'var(--ink-soft)', fontSize:12.5, cursor:'pointer', padding:8 }}
          >
            ← Choose a different login
          </button>
        </form>
      </div>
    </div>
  );
}

// ---------------- App root ----------------
function App(){
  const [session, setSession] = useState(undefined); // undefined = checking, null = signed out
  const [profile, setProfile] = useState(null);
  const [profileError, setProfileError] = useState('');
  const [loadingProfile, setLoadingProfile] = useState(false);
  const [changePwOpen, setChangePwOpen] = useState(false);
  const toast = useToast();
  const sessionRef = useRef(undefined);
  useEffect(() => { sessionRef.current = session; }, [session]);

  // Supabase returns a new session object on every call even when the
  // underlying login hasn't changed at all — updating state with that
  // fresh-but-equivalent object was cascading into a full profile
  // re-fetch and remounting the whole dashboard on every tab switch.
  // Only actually update state when something real changed.
  function applySessionIfChanged(next){
    const current = sessionRef.current;
    // current === undefined means we haven't resolved the very first
    // check yet — always apply that one so the app actually leaves the
    // loading spinner, even when the result is "signed out" (next is
    // null). Without this, a signed-out user's first getSession() call
    // (current=undefined, next=null) looked identical to "no change"
    // and the spinner never cleared.
    if (current === undefined){
      sessionRef.current = next ?? null;
      setSession(next ?? null);
      return;
    }
    const sameToken = current && next && current.access_token === next.access_token;
    const bothSignedOut = !current && !next;
    if (sameToken || bothSignedOut) return;
    sessionRef.current = next ?? null;
    setSession(next ?? null);
  }

  useEffect(() => {
    if (!isConfigured){ setSession(null); return; }
    db.auth.getSession().then(({ data }) => applySessionIfChanged(data.session));
    const { data: listener } = db.auth.onAuthStateChange((_event, newSession) => {
      applySessionIfChanged(newSession);
    });
    return () => listener.subscription.unsubscribe();
  }, []);

  // Mobile browsers throttle/pause background tabs, which can leave the
  // Supabase client's in-memory session state stale by the time you
  // switch back — a known supabase-js behavior, not something specific
  // to this app. Re-check (and if needed, explicitly refresh) the
  // session every time the app comes back to the foreground, instead
  // of trusting the client's own background auto-refresh timer.
  useEffect(() => {
    if (!isConfigured) return;
    let checking = false;
    const recheckSession = async () => {
      if (document.visibilityState !== 'visible' || checking) return;
      checking = true;
      try{
        const { data } = await db.auth.getSession();
        if (data.session){ applySessionIfChanged(data.session); return; }
        const { data: refreshed, error } = await db.auth.refreshSession();
        if (!error && refreshed.session) applySessionIfChanged(refreshed.session);
      } finally {
        checking = false;
      }
    };
    document.addEventListener('visibilitychange', recheckSession);
    window.addEventListener('focus', recheckSession);
    return () => {
      document.removeEventListener('visibilitychange', recheckSession);
      window.removeEventListener('focus', recheckSession);
    };
  }, []);

  useEffect(() => {
    if (!session){ setProfile(null); return; }
    setLoadingProfile(true);
    setProfileError('');
    db.from('atrk_profiles').select('*').eq('id', session.user.id).single()
      .then(({ data, error }) => {
        setLoadingProfile(false);
        if (error || !data){
          setProfileError('Your account has no role assigned yet. Ask an admin to set one up.');
          return;
        }
        setProfile(data);
      });
  }, [session?.user?.id]);

  const handleLogout = async () => {
    if (isConfigured) await db.auth.signOut();
    setSession(null);
    setProfile(null);
  };

  const handleChangeOwnPassword = async (newPassword) => {
    const { error } = await db.auth.updateUser({ password: newPassword });
    if (error){ toast.fire(error.message); return; }
    toast.fire('Password changed');
    setChangePwOpen(false);
  };

  if (session === undefined){
    return <div style={{ minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center' }}><div className="spinner"></div></div>;
  }

  if (!session){
    return <LoginScreen onLogin={setSession} />;
  }

  if (loadingProfile){
    return <div style={{ minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center' }}><div className="spinner"></div></div>;
  }

  if (profileError){
    return (
      <div className="login-wrap">
        <div className="login-card">
          <div className="login-mark"><Icon name="lock" /></div>
          <h1>Access pending</h1>
          <p className="sub">{profileError}</p>
          <button className="btn btn-outline" style={{ width:'100%' }} onClick={handleLogout}>
            <Icon name="logout" /> Sign out
          </button>
        </div>
      </div>
    );
  }

  if (!profile){
    // Session just came in but the profile fetch hasn't started/finished
    // yet (effects run after render) — show a spinner instead of crashing
    // on profile.role during this one in-between render.
    return <div style={{ minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center' }}><div className="spinner"></div></div>;
  }

  return (
    <React.Fragment>
      <div className="topbar">
        <div className="topbar-row">
          <div className="brand">
            <span className="mark"><Icon name="cap" /></span>
            <div>
              <h1>Absentees Tracker</h1>
              <span className="role-pill">{roleLabel(profile.role)}</span>
            </div>
          </div>
          <div style={{ display:'flex', gap:8 }}>
            <button className="icon-btn" onClick={() => setChangePwOpen(true)} aria-label="Change password">
              <Icon name="lock" />
            </button>
            <button className="icon-btn" onClick={handleLogout} aria-label="Sign out">
              <Icon name="logout" />
            </button>
          </div>
        </div>
      </div>

      <OwnPasswordSheet open={changePwOpen} onClose={() => setChangePwOpen(false)} onSave={handleChangeOwnPassword} />

      {profile.role === 'admin' && <AdminDashboard session={session} toast={toast} />}
      {profile.role === 'teacher' && <TeacherDashboard toast={toast} />}
      {profile.role === 'representative' && <RepresentativeDashboard toast={toast} />}

      <Toast msg={toast.msg} show={toast.show} />
    </React.Fragment>
  );
}
</script>

  const __out = Babel.transform(__src, {
    presets: [['react', { runtime: 'classic' }]]
  }).code;
  const __script = document.createElement('script');
  __script.text = __out + '\nReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));';
  document.body.appendChild(__script);

  if ('serviceWorker' in navigator) {
