<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Student Absentees Tracker</title>
<meta name="theme-color" content="#F3F6FE">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Absentees">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  :root{
    --ink: #1B2540;
    --ink-soft: #5E6B8C;
    --ink-faint: #9AA6C4;
    --indigo: #3E62E8;
    --indigo-deep: #2B47C4;
    --indigo-tint: #EEF2FE;
    --indigo-line: #DCE5FB;
    --red: #E0525F;
    --red-tint: #FCEDEF;
    --red-line: #F6D3D7;
    --glass-bg: rgba(255,255,255,0.62);
    --glass-bg-solid: rgba(255,255,255,0.86);
    --glass-border: rgba(255,255,255,0.75);
    --shadow-glass: 0 8px 26px -12px rgba(30,58,138,0.20), 0 1px 2px rgba(30,58,138,0.05);
    --shadow-float: 0 14px 30px -10px rgba(62,98,232,0.55);
    --radius-lg: 24px;
    --radius-md: 16px;
    --radius-sm: 12px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; transition-duration:.001ms !important; } }

  html,body{ height:100%; }
  body{
    margin:0;
    font-family:'Inter', system-ui, sans-serif;
    color: var(--ink);
    background: #F3F6FE;
    min-height:100vh;
    overflow-x:hidden;
  }

  /* soft decorative blobs for depth, kept subtle & white-forward */
  .blob{
    position:fixed;
    border-radius:50%;
    filter: blur(60px);
    z-index:0;
    pointer-events:none;
  }
  .blob-1{ width:280px; height:280px; top:-90px; right:-70px; background: rgba(124,156,247,0.35); }
  .blob-2{ width:240px; height:240px; bottom:10%; left:-90px; background: rgba(224,82,95,0.14); }
  .blob-3{ width:200px; height:200px; top:40%; right:-60px; background: rgba(62,98,232,0.14); }

  #root{ position:relative; z-index:1; max-width: 480px; margin:0 auto; min-height:100vh; padding-bottom: 110px; }

  /* ---------- Top bar ---------- */
  .topbar{
    position: sticky; top:0; z-index:20;
    padding: 16px 16px 12px;
    background: rgba(243,246,254,0.82);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .topbar-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .mark{
    width:38px; height:38px; border-radius:12px;
    background: linear-gradient(135deg, var(--indigo), var(--indigo-deep));
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 6px 14px -6px rgba(62,98,232,0.6);
  }
  .brand .mark svg{ width:19px; height:19px; color:#fff; }
  .brand h1{
    font-family:'Sora', sans-serif;
    font-size: 16.5px; font-weight:700;
    margin:0; letter-spacing:-0.01em; line-height:1.2;
  }
  .brand .date-pill{
    font-family:'Inter', sans-serif;
    font-size: 10.5px; color: var(--ink-soft);
    margin-top:1px;
  }
  .icon-btn{
    width:38px; height:38px; border-radius:12px;
    border:1px solid var(--glass-border);
    background: var(--glass-bg-solid);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; color: var(--ink-soft);
    transition: background .15s ease, color .15s ease, transform .15s ease;
    flex:0 0 auto;
  }
  .icon-btn:hover{ color: var(--indigo); }
  .icon-btn:active{ transform: scale(.94); }
  .icon-btn svg{ width:17px; height:17px; }
  .icon-btn.active{ background: var(--indigo); color:#fff; border-color: var(--indigo); }

  .search-wrap{
    margin-top: 12px;
    display:flex; align-items:center; gap:8px;
    background: var(--glass-bg-solid);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    padding: 10px 14px;
    box-shadow: var(--shadow-glass);
    animation: dropIn .25s ease;
  }
  @keyframes dropIn{ from{ opacity:0; transform: translateY(-6px); } to{ opacity:1; transform:none; } }
  .search-wrap svg{ width:16px; height:16px; color: var(--ink-faint); flex:0 0 auto; }
  .search-wrap input{
    border:none; outline:none; background:transparent;
    font-family:'Inter', sans-serif; font-size:14px; color: var(--ink);
    width:100%;
  }
  .search-wrap input::placeholder{ color: var(--ink-faint); }

  /* ---------- Sections ---------- */
  .content{ padding: 4px 16px 0; }
  .section{ margin-top: 22px; }
  .section-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 12px;
  }
  .section-head h2{
    font-family:'Sora', sans-serif; font-size:15.5px; font-weight:700;
    margin:0; display:flex; align-items:center; gap:7px;
  }
  .section-head .count{
    font-family:'Inter', sans-serif; font-size:11px; color: var(--ink-soft);
    background: var(--indigo-tint); padding:3px 9px; border-radius:999px;
  }
  .section-head .count.red{ background: var(--red-tint); color:#A5404A; }
  .sort-chip{
    display:flex; align-items:center; gap:5px;
    font-family:'Inter', sans-serif; font-size:11px; font-weight:600;
    color: var(--indigo-deep); background: var(--indigo-tint);
    border: 1px solid var(--indigo-line);
    padding: 6px 11px; border-radius:999px; cursor:pointer;
    transition: transform .15s ease;
  }
  .sort-chip:active{ transform: scale(.95); }
  .sort-chip svg{ width:12px; height:12px; transition: transform .2s ease; }
  .sort-chip.desc svg{ transform: rotate(180deg); }

  .manage-chip{
    display:flex; align-items:center;
    font-family:'Inter', sans-serif; font-size:11px; font-weight:600;
    color: var(--ink-soft); background: #EFF2FA;
    border: 1px solid var(--line);
    padding: 6px 11px; border-radius:999px; cursor:pointer;
    transition: transform .15s ease, background .15s ease, color .15s ease, border-color .15s ease;
  }
  .manage-chip:active{ transform: scale(.95); }
  .manage-chip.active{
    background: var(--red); color:#fff; border-color: var(--red);
  }

  .manage-banner{
    display:flex; align-items:center; gap:8px;
    background: var(--red-tint); border:1px solid var(--red-line);
    color:#A5404A; font-size:12.5px; font-weight:500;
    border-radius: var(--radius-sm); padding: 10px 13px;
    margin-bottom: 12px;
    animation: dropIn .25s ease;
  }
  .manage-banner svg{ width:14px; height:14px; flex:0 0 auto; }

  /* ---------- Student grid (glass cards) ---------- */
  #studentsGrid{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap:10px;
  }
  .student-card{
    position:relative;
    background: rgba(255,255,255,0.82);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-glass);
    padding: 14px 12px 12px;
    cursor:pointer;
    opacity:0; transform: translateY(10px) scale(.97);
    animation: cardIn .4s cubic-bezier(.22,1,.36,1) forwards;
    transition: transform .18s ease, box-shadow .18s ease;
    user-select:none;
    content-visibility: auto;
    contain-intrinsic-size: 120px;
  }
  @keyframes cardIn{ to{ opacity:1; transform:none; } }
  .student-card:hover{ transform: translateY(-2px); box-shadow: 0 14px 28px -14px rgba(30,58,138,0.30); }
  .student-card:active{ transform: scale(.96); }
  .student-card.is-absent{
    background: var(--red-tint);
    border-color: var(--red-line);
  }
  .student-card.manage-mode{
    border-color: var(--red-line);
    background: rgba(252,237,239,0.9);
    padding-bottom: 34px;
  }
  .student-card .avatar{
    width:34px; height:34px; border-radius:50%;
    background: linear-gradient(135deg, var(--indigo), var(--indigo-deep));
    color:#fff; font-family:'Sora', sans-serif; font-weight:700; font-size:12.5px;
    display:flex; align-items:center; justify-content:center;
    margin-bottom:9px;
    transition: background .2s ease;
  }
  .student-card.is-absent .avatar{ background: linear-gradient(135deg, var(--red), #C43B48); }
  .student-card .s-name{
    font-size:13.5px; font-weight:600; color: var(--ink);
    line-height:1.25; margin-bottom:2px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .student-card .s-roll{
    font-family:'Inter', sans-serif; font-size:10.5px; color: var(--ink-soft);
  }
  .student-card .badge-absent{
    position:absolute; top:9px; right:9px;
    font-size:9px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    color:#fff; background: var(--red);
    padding: 2.5px 7px; border-radius:999px;
  }
  .student-card .del-btn{
    position:absolute; bottom:9px; right:9px;
    width:24px; height:24px; border-radius:50%;
    border:none; background: rgba(255,255,255,0.75);
    color: var(--ink-faint);
    display:flex; align-items:center; justify-content:center;
    opacity:0; transition: opacity .15s ease, background .15s ease, color .15s ease;
  }
  .student-card:hover .del-btn{ opacity:1; }
  .student-card .del-btn:hover{ background: var(--red); color:#fff; }
  .student-card .del-btn svg{ width:12px; height:12px; }
  .student-card .del-btn-visible{
    opacity:1; background: var(--red); color:#fff;
  }

  .student-card.removing{ animation: cardOut .28s ease forwards; }
  @keyframes cardOut{ to{ opacity:0; transform: scale(.85); } }

  /* ---------- Absent Today (glass list) ---------- */
  #absentCard{
    background: var(--glass-bg-solid);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-glass);
    padding: 18px;
  }
  .report-head{ margin-bottom: 4px; }
  .report-title{ font-family:'Sora', sans-serif; font-weight:700; font-size:15.5px; margin:0; }
  .report-date{ font-family:'Inter', sans-serif; font-size:11px; color: var(--ink-soft); margin-top:2px; }

  #absentList{ list-style:none; margin:14px 0 0; padding:0; display:flex; flex-direction:column; gap:9px; }
  .absent-item{
    display:flex; align-items:center; gap:11px;
    background: var(--red-tint);
    border:1px solid var(--red-line);
    border-radius: var(--radius-sm);
    padding: 11px 12px;
    cursor:pointer;
    opacity:0; transform: translateX(-12px);
    animation: rowIn .38s cubic-bezier(.22,1,.36,1) forwards;
    transition: transform .15s ease;
  }
  @keyframes rowIn{ to{ opacity:1; transform:none; } }
  .absent-item:active{ transform: scale(.98); }
  .absent-item .dot{ width:7px; height:7px; border-radius:50%; background: var(--red); flex:0 0 auto; box-shadow: 0 0 0 4px rgba(224,82,95,0.14); }
  .absent-item .info{ flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
  .absent-item .a-name{ font-size:13.5px; font-weight:600; color: var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .absent-item .a-meta{ font-family:'Inter', sans-serif; font-size:10.5px; color:#A5606A; }
  .absent-item .undo-hint{ font-size:10px; color:#B5717A; flex:0 0 auto; }
  .absent-item.removing{ animation: rowOut .26s ease forwards; }
  @keyframes rowOut{ to{ opacity:0; transform: translateX(20px) scale(.95); } }

  .btn{
    border:none; cursor:pointer; font-family:'Inter', sans-serif; font-weight:600;
    border-radius:14px; position:relative; overflow:hidden;
    transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  }
  .btn:active{ transform: translateY(1px) scale(.99); }
  .btn:disabled{ opacity:.55; pointer-events:none; }
  .btn-share{
    width:100%; margin-top:14px;
    background: linear-gradient(180deg, var(--indigo), var(--indigo-deep));
    color:#fff; font-size:14px; padding:12px 16px;
    display:flex; align-items:center; justify-content:center; gap:8px;
    box-shadow: 0 10px 20px -8px rgba(62,98,232,0.55);
  }
  .btn-share svg{ width:15px; height:15px; }
  .btn-share-text{
    width:100%; margin-top:10px;
    background: #fff;
    border: 1.5px solid var(--indigo-line);
    color: var(--indigo-deep); font-size:14px; padding:11px 16px;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn-share-text:hover{ background: var(--indigo-tint); }
  .btn-share-text svg{ width:15px; height:15px; }
  .btn-share-pdf{
    width:100%; margin-top:10px;
    background: linear-gradient(180deg, #2B3555, var(--ink));
    color:#fff; font-size:14px; padding:11px 16px;
    display:flex; align-items:center; justify-content:center; gap:8px;
    box-shadow: 0 10px 20px -8px rgba(27,37,64,0.45);
  }
  .btn-share-pdf svg{ width:15px; height:15px; }
  .btn-share-pdf .pdf-badge{
    font-size:9px; font-weight:700; letter-spacing:.04em;
    background: rgba(255,255,255,0.16); padding:2px 7px; border-radius:999px;
  }

  /* ---------- loading / empty ---------- */
  .spinner{
    width:24px; height:24px; border-radius:50%;
    border:3px solid var(--indigo-tint); border-top-color: var(--indigo);
    margin: 16px auto; animation: spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .empty-state{ text-align:center; padding: 18px 10px 8px; color: var(--ink-soft); grid-column: 1 / -1; }
  .empty-state .glyph{ margin-bottom:8px; opacity:.4; display:flex; justify-content:center; }
  .empty-state .glyph svg{ width:26px; height:26px; }
  .empty-state p{ margin:0; font-size:13px; }
  .empty-state span{ font-size:11px; color: var(--ink-faint); }

  /* ---------- floating add button ---------- */
  .fab{
    position: fixed; right: 20px; bottom: calc(78px + env(safe-area-inset-bottom)); z-index:30;
    width:58px; height:58px; border-radius:50%;
    background: linear-gradient(135deg, var(--indigo), var(--indigo-deep));
    color:#fff; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow: var(--shadow-float);
    transition: transform .18s cubic-bezier(.22,1,.36,1);
  }
  .fab:active{ transform: scale(.9) rotate(90deg); }
  .fab svg{ width:24px; height:24px; }

  /* ---------- bottom tab bar ---------- */
  .tabbar{
    position: fixed; left:0; right:0; bottom:0; z-index:25;
    max-width:480px; margin:0 auto;
    display:flex;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid var(--glass-border);
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    box-shadow: 0 -8px 24px -14px rgba(30,58,138,0.25);
  }
  .tabbar-btn{
    flex:1;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    border:none; background:transparent; cursor:pointer;
    padding: 6px 4px; border-radius:14px;
    color: var(--ink-faint);
    transition: color .15s ease, background .15s ease;
  }
  .tabbar-btn svg{ width:19px; height:19px; }
  .tabbar-btn span:not(.tabbar-count){
    font-family:'Inter', sans-serif; font-size:10.5px; font-weight:600;
  }
  .tabbar-btn.active{ color: var(--indigo-deep); background: var(--indigo-tint); }
  .tabbar-btn.active .tabbar-count.red{ background: var(--red); color:#fff; }
  .tabbar-count{
    font-family:'Inter', sans-serif; font-size:9.5px; font-weight:700;
    background: var(--indigo-tint); color: var(--indigo-deep);
    padding: 1px 7px; border-radius:999px; margin-top:1px;
  }
  .tabbar-count.red{ background: var(--red-tint); color:#A5404A; }

  /* ---------- bottom sheet ---------- */
  .sheet-backdrop{
    position:fixed; inset:0; background: rgba(20,30,60,0.35);
    backdrop-filter: blur(2px);
    z-index:40; opacity:0; pointer-events:none;
    transition: opacity .25s ease;
  }
  .sheet-backdrop.open{ opacity:1; pointer-events:auto; }
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:41;
    max-width:480px; margin:0 auto;
    background:#fff;
    border-radius: 26px 26px 0 0;
    padding: 10px 20px calc(22px + env(safe-area-inset-bottom));
    box-shadow: 0 -20px 50px -20px rgba(20,30,60,0.35);
    transform: translateY(100%);
    transition: transform .32s cubic-bezier(.22,1,.36,1);
  }
  .sheet.open{ transform: translateY(0); }
  .sheet-handle{ width:38px; height:4px; background:#E4E9F7; border-radius:999px; margin: 8px auto 16px; }
  .sheet h3{ font-family:'Sora', sans-serif; font-size:17px; font-weight:700; margin:0 0 16px; }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:11.5px; font-weight:600; color: var(--ink-soft); margin:0 0 6px 4px; }
  .field input{
    width:100%; border:1.5px solid #E4E9F7; background:#FBFCFF;
    border-radius:14px; padding:12px 15px; font-size:15px;
    font-family:'Inter', sans-serif; color: var(--ink); outline:none;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .field input:focus{ border-color: var(--indigo); box-shadow: 0 0 0 4px var(--indigo-tint); }
  .sheet-actions{ display:flex; gap:10px; margin-top:6px; }
  .sheet-actions .btn-cancel{
    flex:1; background:#F1F4FC; color: var(--ink-soft); font-size:14.5px; padding:12px;
  }
  .sheet-actions .btn-save{
    flex:1.4; background: linear-gradient(180deg, var(--indigo), var(--indigo-deep)); color:#fff;
    font-size:14.5px; padding:12px; box-shadow: 0 10px 20px -8px rgba(62,98,232,0.55);
  }

  .ripple{ position:absolute; border-radius:50%; background: rgba(255,255,255,0.55); transform: scale(0); animation: rippleAnim .6s ease-out forwards; pointer-events:none; }
  @keyframes rippleAnim{ to{ transform: scale(2.8); opacity:0; } }

  .toast{
    position:fixed; left:50%; bottom:100px; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color:#fff; font-size:13px; font-weight:500;
    padding: 11px 18px; border-radius:999px; box-shadow: 0 12px 28px -8px rgba(0,0,0,.35);
    opacity:0; pointer-events:none; transition: opacity .25s ease, transform .25s ease;
    z-index:60; max-width:88vw; text-align:center;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }

  #configBanner{
    display:none; margin: 0 16px 4px;
    background:#FFF7E6; border:1px solid #F3D98B; color:#7A5B06;
    font-size:12px; line-height:1.5; border-radius: var(--radius-md); padding:12px 14px;
  }
  #configBanner code{ background: rgba(0,0,0,0.06); padding:1px 5px; border-radius:5px; font-family:'JetBrains Mono', monospace; font-size:11px; }

  .offline-banner{
    display:flex; align-items:center; gap:8px;
    margin: 0 16px 4px;
    background:#EFF2FA; border:1px solid var(--line); color: var(--ink-soft);
    font-size:12px; font-weight:500; line-height:1.4;
    border-radius: var(--radius-md); padding:10px 14px;
    animation: dropIn .25s ease;
  }
  .offline-banner svg{ width:15px; height:15px; flex:0 0 auto; }

  @media (min-width: 420px){
    #studentsGrid{ grid-template-columns: repeat(3, 1fr); }
  }

  /* ---------- Hidden export template (for html2canvas) ----------
     Kept deliberately plain: no flexbox, no CSS animations, no
     dependency on viewport/scroll position. html2canvas support for
     those features is inconsistent across mobile browsers, so the
     shareable image is built from this simple block-layout copy
     instead of screenshotting the live animated UI. */
  #exportCard{
    position: absolute;
    left: -9999px;
    top: 0;
    width: 380px;
    background: #ffffff;
    padding: 22px;
    font-family: 'Inter', sans-serif;
    color: #1B2540;
  }
  #exportCard .exp-title{ font-family:'Sora', sans-serif; font-weight:700; font-size:19px; margin:0 0 4px; }
  #exportCard .exp-date{ font-family:'Inter', sans-serif; font-size:12px; color:#5E6B8C; margin:0 0 16px; }
  #exportCard .exp-row{ background:#FCEDEF; border:1px solid #F6D3D7; border-radius:14px; padding:12px 14px; margin:0 0 10px; }
  #exportCard .exp-name{ font-size:14.5px; font-weight:600; color:#1B2540; margin:0 0 4px; }

<script type="text/plain" id="app-source">
const { useState, useEffect, useRef, useMemo } = React;

// ============================================================
// SUPABASE CONFIG — same project as your other attendance app.
// ============================================================
const SUPABASE_URL = 'https://nwqhigskbldybobcdrgv.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_RrNiWXYkZn1RJyb3z9Idzg_tn6QAdeO';
const isConfigured = SUPABASE_URL.startsWith('https://') && SUPABASE_ANON_KEY.length > 10;
const db = isConfigured ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

function todayInfo(){
  const d = new Date();
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off*60000);
  const date = local.toISOString().slice(0,10);
  const day = d.toLocaleDateString('en-US', { weekday: 'long' });
  return { date, day };
}
function initials(name){
  return name.trim().split(/\s+/).slice(0,2).map(w => w[0]?.toUpperCase() || '').join('');
}
function rollCompare(a, b){
  const na = parseFloat(a), nb = parseFloat(b);
  if (!isNaN(na) && !isNaN(nb) && String(na) === a.trim() && String(nb) === b.trim()) return na - nb;
  return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
}

// ============================================================
// Offline support — local cache + write queue.
// Last-synced students/absentees are mirrored into localStorage so
// the app still shows data with zero connection. Writes made while
// offline (add/delete student, mark/unmark absent) are queued here
// and replayed against Supabase once the connection returns.
// ============================================================
const LS_STUDENTS_KEY = 'atrk:students';
const LS_ABSENTEES_PREFIX = 'atrk:absentees:';
const LS_QUEUE_KEY = 'atrk:queue';

function lsGet(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  }catch(e){ return fallback; }
}
function lsSet(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){ /* storage unavailable/full — degrade silently */ }
}
function makeLocalId(){
  return 'local-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
}
function isLocalId(id){
  return typeof id === 'string' && id.startsWith('local-');
}
function getQueue(){ return lsGet(LS_QUEUE_KEY, []); }

function useToast(){
  const [msg, setMsg] = useState('');
  const [show, setShow] = useState(false);
  const timer = useRef(null);
  const fire = (text) => {
    setMsg(text); setShow(true);
    clearTimeout(timer.current);
    timer.current = setTimeout(() => setShow(false), 2400);
  };
  return { msg, show, fire };
}

function Toast({ msg, show }){
  return <div className={"toast" + (show ? " show" : "")}>{msg}</div>;
}

function Icon({ name, ...props }){
  const paths = {
    plus: <path d="M12 5v14M5 12h14"/>,
    search: <><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></>,
    sortAsc: <path d="M3 6h13M3 12h9M3 18h5M18 18V6m0 0l-4 4m4-4l4 4"/>,
    trash: <><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/></>,
    share: <><path d="M12 3v13"/><path d="M7 8l5-5 5 5"/><path d="M5 21h14"/></>,
    check: <path d="M20 6L9 17l-5-5"/>,
    cap: <><path d="M22 10L12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/></>,
    file: <><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></>,
    offline: <><path d="M1 1l22 22"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><path d="M12 20h.01"/></>
  };
  return (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.1" strokeLinecap="round" strokeLinejoin="round" {...props}>
      {paths[name]}
    </svg>
  );
}

function StudentCard({ student, isAbsent, index, manageMode, onToggle, onDelete }){
  const [leaving, setLeaving] = useState(false);

  const handleDelete = () => {
    if (!window.confirm(`Remove ${student.name} from the student list? This also clears their absence history.`)) return;
    setLeaving(true);
    setTimeout(() => onDelete(student), 260);
  };

  const handleClick = () => {
    if (manageMode) handleDelete();
    else onToggle(student);
  };

  return (
    <div
      className={"student-card" + (isAbsent ? " is-absent" : "") + (leaving ? " removing" : "") + (manageMode ? " manage-mode" : "")}
      style={{ animationDelay: (index * 0.025) + 's' }}
      onClick={handleClick}
    >
      {isAbsent && !manageMode && <span className="badge-absent">Absent</span>}
      <div className="avatar">{initials(student.name)}</div>
      <div className="s-name">{student.name}</div>
      <div className="s-roll">Roll {student.roll_no}</div>
      {manageMode && (
        <span className="del-btn del-btn-visible" aria-label="Delete student">
          <Icon name="trash" />
        </span>
      )}
    </div>
  );
}

function AbsentRow({ entry, index, onRemove }){
  const [leaving, setLeaving] = useState(false);
  const handleClick = () => {
    setLeaving(true);
    setTimeout(() => onRemove(entry), 240);
  };
  return (
    <li
      className={"absent-item" + (leaving ? " removing" : "")}
      style={{ animationDelay: (index * 0.03) + 's' }}
      onClick={handleClick}
    >
      <span className="dot"></span>
      <span className="info">
        <span className="a-name">{entry.name}</span>
        <span className="a-meta">Roll {entry.roll_no}</span>
      </span>
      <span className="undo-hint">tap to undo</span>
    </li>
  );
}

function AddSheet({ open, onClose, onSave, existingRolls }){
  const [name, setName] = useState('');
  const [roll, setRoll] = useState('');
  const [saving, setSaving] = useState(false);
  const nameRef = useRef(null);

  useEffect(() => {
    if (open) { setName(''); setRoll(''); setTimeout(() => nameRef.current && nameRef.current.focus(), 260); }
  }, [open]);

  const handleSave = async () => {
    const n = name.trim(), r = roll.trim();
    if (!n || !r) return;
    if (existingRolls.has(r.toLowerCase())) { alert(`Roll number ${r} already exists.`); return; }
    setSaving(true);
    await onSave(n, r);
    setSaving(false);
  };

  return (
    <React.Fragment>
      <div className={"sheet-backdrop" + (open ? " open" : "")} onClick={onClose}></div>
      <div className={"sheet" + (open ? " open" : "")}>
        <div className="sheet-handle"></div>
        <h3>Add student</h3>
        <div className="field">
          <label>Name</label>
          <input ref={nameRef} type="text" placeholder="e.g. Aarav Mehta" value={name}
            onChange={e => setName(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && handleSave()} />
        </div>
        <div className="field">
          <label>Roll number</label>
          <input type="text" placeholder="e.g. 24" value={roll}
            onChange={e => setRoll(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && handleSave()} />
        </div>
        <div className="sheet-actions">
          <button className="btn btn-cancel" onClick={onClose}>Cancel</button>
          <button className="btn btn-save" onClick={handleSave} disabled={saving}>
            {saving ? 'Saving…' : 'Save student'}
          </button>
        </div>
      </div>
    </React.Fragment>
  );
}

function ExportCard({ absentees, date, day }){
  return (
    <div id="exportCard">
      <p className="exp-title">Absentees List</p>
      <p className="exp-date">{day}, {date} · Total {absentees.length}</p>
      {absentees.length === 0 ? (
        <p className="exp-empty">No absentees today</p>
      ) : absentees.map(a => (
        <div className="exp-row" key={a.id}>
          <p className="exp-name">{a.name}</p>
          <p className="exp-roll">Roll {a.roll_no}</p>
        </div>
      ))}
    </div>
  );
}

function App(){
  const { date, day } = useMemo(todayInfo, []);
  const [students, setStudents] = useState([]);
  const [absentees, setAbsentees] = useState([]);
  const [loadingStudents, setLoadingStudents] = useState(true);
  const [loadingAbsent, setLoadingAbsent] = useState(true);
  const [search, setSearch] = useState('');
  const [searchOpen, setSearchOpen] = useState(false);
  const [sortAsc, setSortAsc] = useState(true);
  const [manageMode, setManageMode] = useState(false);
  const [activePage, setActivePage] = useState('students'); // 'students' | 'absent'
  const [sheetOpen, setSheetOpen] = useState(false);
  const [sharing, setSharing] = useState(false);
  const [sharingText, setSharingText] = useState(false);
  const [sharingPDF, setSharingPDF] = useState(false);
  const [isOnline, setIsOnline] = useState(typeof navigator !== 'undefined' ? navigator.onLine : true);
  const [pendingCount, setPendingCount] = useState(() => getQueue().length);
  const toast = useToast();

  function setQueue(q){ lsSet(LS_QUEUE_KEY, q); setPendingCount(q.length); }
  function enqueue(action){ const q = getQueue(); q.push(action); setQueue(q); }

  useEffect(() => {
    if (!isConfigured) { setLoadingStudents(false); setLoadingAbsent(false); return; }
    loadStudents();
    loadAbsentees();
    if (navigator.onLine) flushQueue();
  }, []);

  // Keep local cache mirrored to whatever's currently in state, from
  // whichever source it came from (server fetch or offline edit) —
  // so a reload while offline still shows the latest known data.
  useEffect(() => { lsSet(LS_STUDENTS_KEY, students); }, [students]);
  useEffect(() => { lsSet(LS_ABSENTEES_PREFIX + date, absentees); }, [absentees, date]);

  useEffect(() => {
    const goOnline = () => { setIsOnline(true); toast.fire('Back online — syncing…'); flushQueue(); };
    const goOffline = () => { setIsOnline(false); toast.fire('You are offline — changes will sync later'); };
    window.addEventListener('online', goOnline);
    window.addEventListener('offline', goOffline);
    return () => {
      window.removeEventListener('online', goOnline);
      window.removeEventListener('offline', goOffline);
    };
  }, []);

  async function loadStudents(){
    setLoadingStudents(true);
    if (!isConfigured){
      setLoadingStudents(false);
      setStudents(lsGet(LS_STUDENTS_KEY, []));
      return;
    }
    const { data, error } = await db.from('students').select('*').order('name', { ascending: true });
    setLoadingStudents(false);
    if (error){
      console.error(error);
      const cached = lsGet(LS_STUDENTS_KEY, null);
      if (cached){ setStudents(cached); toast.fire('Offline — showing last saved students'); }
      else toast.fire('Could not load students');
      return;
    }
    setStudents(data || []);
  }

  async function loadAbsentees(){
    setLoadingAbsent(true);
    const cacheKey = LS_ABSENTEES_PREFIX + date;
    if (!isConfigured){
      setLoadingAbsent(false);
      setAbsentees(lsGet(cacheKey, []));
      return;
    }
    const { data, error } = await db.from('absentees').select('*').eq('date', date);
    setLoadingAbsent(false);
    if (error){
      console.error(error);
      const cached = lsGet(cacheKey, null);
      if (cached){ setAbsentees(cached); toast.fire('Offline — showing last saved absentees'); }
      else toast.fire('Could not load absentees');
      return;
    }
    setAbsentees(data || []);
  }

  const existingRolls = useMemo(() => new Set(students.map(s => s.roll_no.toLowerCase())), [students]);
  const absentIds = useMemo(() => new Set(absentees.map(a => a.student_id)), [absentees]);
  const sortedAbsentees = useMemo(
    () => [...absentees].sort((a, b) => rollCompare(a.roll_no, b.roll_no)),
    [absentees]
  );

  const visibleStudents = useMemo(() => {
    let list = students.filter(s =>
      s.name.toLowerCase().includes(search.toLowerCase()) ||
      s.roll_no.toLowerCase().includes(search.toLowerCase())
    );
    list = [...list].sort((a, b) => sortAsc ? rollCompare(a.roll_no, b.roll_no) : rollCompare(b.roll_no, a.roll_no));
    return list;
  }, [students, search, sortAsc]);

  async function handleAddStudent(name, roll_no){
    if (!isConfigured){
      const newStudent = { id: makeLocalId(), name, roll_no };
      setStudents(prev => [...prev, newStudent]);
      setSheetOpen(false);
      toast.fire(`${name} added`);
      return;
    }

    if (!isOnline){
      const localId = makeLocalId();
      setStudents(prev => [...prev, { id: localId, name, roll_no }]);
      enqueue({ type: 'add_student', localId, name, roll_no });
      setSheetOpen(false);
      toast.fire(`${name} added — will sync when back online`);
      return;
    }

    const { data, error } = await db.from('students').insert([{ name, roll_no }]).select();
    if (error){
      if (error.code === '23505'){ toast.fire(`Roll number ${roll_no} already exists`); return; }
      // Nominally online but the request itself failed (flaky connection) —
      // don't lose the entry, fall back to the same offline queue path.
      console.error(error);
      const localId = makeLocalId();
      setStudents(prev => [...prev, { id: localId, name, roll_no }]);
      enqueue({ type: 'add_student', localId, name, roll_no });
      setSheetOpen(false);
      toast.fire(`${name} added — will sync when back online`);
      return;
    }
    if (data && data[0]) setStudents(prev => [...prev, data[0]]);
    setSheetOpen(false);
    toast.fire(`${name} added`);
  }

  async function handleDeleteStudent(student){
    setStudents(prev => prev.filter(s => s.id !== student.id));
    setAbsentees(prev => prev.filter(a => a.student_id !== student.id));

    if (isLocalId(student.id)){
      // Never synced — just drop the queued add (and anything that
      // depended on it) instead of issuing a delete for a row that
      // doesn't exist on the server.
      const q = getQueue().filter(a =>
        !(a.type === 'add_student' && a.localId === student.id) &&
        !(a.type === 'mark_absent' && a.studentId === student.id)
      );
      setQueue(q);
      toast.fire(`${student.name} removed`);
      return;
    }

    if (!isConfigured){ toast.fire(`${student.name} removed`); return; }

    if (!isOnline){
      enqueue({ type: 'delete_student', studentId: student.id });
      toast.fire(`${student.name} removed — will sync when back online`);
      return;
    }

    const { error } = await db.from('students').delete().eq('id', student.id);
    if (error){
      console.error(error);
      enqueue({ type: 'delete_student', studentId: student.id });
      toast.fire(`${student.name} removed — will sync when back online`);
      return;
    }
    toast.fire(`${student.name} removed`);
  }

  async function handleToggleAbsent(student){
    const existing = absentees.find(a => a.student_id === student.id);
    if (existing){
      removeAbsentEntry(existing);
      return;
    }

    const localId = makeLocalId();
    const optimistic = { id: localId, student_id: student.id, name: student.name, roll_no: student.roll_no, date, day };
    setAbsentees(prev => [...prev, optimistic]);

    if (!isConfigured) return;

    if (!isOnline){
      enqueue({ type: 'mark_absent', localId, studentId: student.id, name: student.name, roll_no: student.roll_no, date, day });
      return;
    }

    const { data, error } = await db.from('absentees').insert([
      { student_id: student.id, name: student.name, roll_no: student.roll_no, date, day }
    ]).select();
    if (error){
      if (error.code === '23505'){
        setAbsentees(prev => prev.filter(a => a.id !== localId));
        toast.fire(`${student.name} is already marked absent today`);
        return;
      }
      // Treat a failed-while-online request as a connectivity blip rather
      // than losing the tap — queue it instead of reverting.
      console.error(error);
      enqueue({ type: 'mark_absent', localId, studentId: student.id, name: student.name, roll_no: student.roll_no, date, day });
      return;
    }
    if (data && data[0]) setAbsentees(prev => prev.map(a => a.id === localId ? data[0] : a));
  }

  async function removeAbsentEntry(entry){
    setAbsentees(prev => prev.filter(a => a.id !== entry.id));

    if (isLocalId(entry.id)){
      // Never synced — just drop the queued mark_absent instead of
      // issuing a delete for a row that doesn't exist on the server.
      const q = getQueue().filter(a => !(a.type === 'mark_absent' && a.localId === entry.id));
      setQueue(q);
      return;
    }

    if (!isConfigured) return;

    if (!isOnline){
      enqueue({ type: 'unmark_absent', absentId: entry.id });
      return;
    }

    const { error } = await db.from('absentees').delete().eq('id', entry.id);
    if (error){
      console.error(error);
      enqueue({ type: 'unmark_absent', absentId: entry.id });
    }
  }

  async function flushQueue(){
    if (!isConfigured) return;
    const q = getQueue();
    if (q.length === 0) return;

    const idMap = {}; // localId -> real server id, resolved as add_student actions succeed
    const remaining = [];
    let anySucceeded = false;

    for (const action of q){
      try{
        if (action.type === 'add_student'){
          const { data, error } = await db.from('students').insert([{ name: action.name, roll_no: action.roll_no }]).select();
          if (error){
            if (error.code === '23505'){
              // Someone else already added this roll number — resolve the
              // real id so anything queued after this can still proceed.
              const { data: existing } = await db.from('students').select('*').eq('roll_no', action.roll_no).limit(1);
              if (existing && existing[0]) idMap[action.localId] = existing[0].id;
              anySucceeded = true;
              continue;
            }
            remaining.push(action);
            continue;
          }
          if (data && data[0]){
            idMap[action.localId] = data[0].id;
            setStudents(prev => prev.map(s => s.id === action.localId ? data[0] : s));
          }
          anySucceeded = true;
        } else if (action.type === 'delete_student'){
          const id = idMap[action.studentId] || action.studentId;
          const { error } = await db.from('students').delete().eq('id', id);
          if (error){ remaining.push(action); continue; }
          anySucceeded = true;
        } else if (action.type === 'mark_absent'){
          const studentId = idMap[action.studentId] || action.studentId;
          const { data, error } = await db.from('absentees').insert([
            { student_id: studentId, name: action.name, roll_no: action.roll_no, date: action.date, day: action.day }
          ]).select();
          if (error){
            if (error.code === '23505'){ anySucceeded = true; continue; } // already marked — fine
            remaining.push(action);
            continue;
          }
          if (data && data[0]){
            setAbsentees(prev => prev.map(a => a.id === action.localId ? data[0] : a));
          }
          anySucceeded = true;
        } else if (action.type === 'unmark_absent'){
          const id = idMap[action.absentId] || action.absentId;
          const { error } = await db.from('absentees').delete().eq('id', id);
          if (error){ remaining.push(action); continue; }
          anySucceeded = true;
        }
      }catch(err){
        console.error(err);
        remaining.push(action);
      }
    }

    setQueue(remaining);
    if (anySucceeded){
      toast.fire(remaining.length === 0 ? 'Synced offline changes' : 'Synced some changes — retrying the rest');
      loadStudents();
      loadAbsentees();
    }
  }

  async function handleShare(){
    if (typeof html2canvas === 'undefined'){ toast.fire('Could not load image tool'); return; }
    setSharing(true);
    try{
      const el = document.getElementById('exportCard');

      // Mobile browsers cap how tall a canvas can be (commonly somewhere
      // around 4000–8000px depending on the device/GPU). A long absentee
      // list at a fixed scale of 2 can exceed that, causing the browser to
      // silently shrink the canvas to fit — which is what blurs the image.
      // Scale the resolution down as the list grows so the final canvas
      // height stays under a safe cap, with a floor so it never gets
      // illegibly small for extremely long lists.
      const naturalHeight = el.scrollHeight;
      const MAX_CANVAS_HEIGHT = 6000; // final output px, safe across mobile browsers
      const scale = Math.max(0.5, Math.min(2, MAX_CANVAS_HEIGHT / naturalHeight));

      const canvas = await html2canvas(el, {
        backgroundColor: '#ffffff',
        scale,
        useCORS: true
      });
      canvas.toBlob(async (blob) => {
        if (!blob){ toast.fire('Could not create image'); setSharing(false); return; }
        const fileName = `absentees-${date}.png`;
        const file = new File([blob], fileName, { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] })){
          try{
            await navigator.share({ files: [file], title: 'Absentees List', text: `Absentees List — ${day}, ${date}` });
            toast.fire('Shared successfully');
          }catch(err){
            if (err && err.name !== 'AbortError'){ downloadBlob(blob, fileName); toast.fire('Image downloaded'); }
          }
        } else {
          downloadBlob(blob, fileName);
          toast.fire('Image downloaded');
        }
        setSharing(false);
      }, 'image/png');
    }catch(err){
      console.error(err); toast.fire('Something went wrong'); setSharing(false);
    }
  }

  async function handleShareText(){
    setSharingText(true);
    try{
      const lines = [
        'ABSENTEES LIST',
        `${day}, ${date}`,
        `Total absent: ${sortedAbsentees.length}`,
        ''
      ];
      if (sortedAbsentees.length === 0){
        lines.push('No absentees today.');
      } else {
        sortedAbsentees.forEach((a, i) => {
          lines.push(`${String(i + 1).padStart(2, '0')}. ${a.name} — Roll ${a.roll_no}`);
        });
      }
      lines.push('', 'Generated by Student Absentees Tracker');
      const text = lines.join('\n');

      // Share as actual text content (not an attached file), so apps like
      // WhatsApp/SMS/Email open with the message body already filled in.
      if (navigator.share){
        try{
          await navigator.share({ title: 'Absentees List', text });
          toast.fire('Shared successfully');
        }catch(err){
          if (err && err.name !== 'AbortError'){
            await copyTextFallback(text);
          }
        }
      } else {
        await copyTextFallback(text);
      }
    }catch(err){
      console.error(err); toast.fire('Something went wrong');
    }
    setSharingText(false);
  }

  async function copyTextFallback(text){
    if (navigator.clipboard && navigator.clipboard.writeText){
      try{
        await navigator.clipboard.writeText(text);
        toast.fire('Copied to clipboard');
        return;
      }catch(err){ /* fall through to file download below */ }
    }
    const blob = new Blob([text], { type: 'text/plain' });
    downloadBlob(blob, `absentees-${date}.txt`);
    toast.fire('Text file downloaded');
  }

  async function handleSharePDF(){
    if (typeof window.jspdf === 'undefined'){ toast.fire('Could not load PDF tool'); return; }
    setSharingPDF(true);
    try{
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'pt', format: 'a4' });
      const pageWidth = doc.internal.pageSize.getWidth();
      const pageHeight = doc.internal.pageSize.getHeight();
      const marginX = 42;
      const bottomLimit = pageHeight - 56;
      let y = 58;

      // Title + date/day/total — drawn as real vector text, so it stays
      // crisp at any zoom instead of the pixel blur a rasterized image
      // can hit on long lists.
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(20);
      doc.setTextColor(27, 37, 64);
      doc.text('Absentees List', marginX, y);

      y += 20;
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(11);
      doc.setTextColor(94, 107, 140);
      doc.text(`${day}, ${date}  ·  Total ${sortedAbsentees.length}`, marginX, y);

      y += 28;

      const rowHeight = 40;
      const rowGap = 8;
      const rowWidth = pageWidth - marginX * 2;

      if (sortedAbsentees.length === 0){
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(12);
        doc.setTextColor(94, 107, 140);
        doc.text('No absentees today.', marginX, y);
      } else {
        sortedAbsentees.forEach((a) => {
          if (y + rowHeight > bottomLimit){
            doc.addPage();
            y = 58;
          }
          // row card, matching the app's light-red absent styling
          doc.setFillColor(252, 237, 239);
          doc.setDrawColor(246, 211, 215);
          doc.roundedRect(marginX, y, rowWidth, rowHeight, 6, 6, 'FD');

          doc.setFillColor(224, 82, 95);
          doc.circle(marginX + 15, y + rowHeight / 2, 3, 'F');

          doc.setFont('helvetica', 'bold');
          doc.setFontSize(12);
          doc.setTextColor(27, 37, 64);
          doc.text(a.name, marginX + 28, y + 17);

          doc.setFont('helvetica', 'normal');
          doc.setFontSize(10.5);
          doc.setTextColor(165, 96, 106);
          doc.text(`Roll ${a.roll_no}`, marginX + 28, y + 30);

          y += rowHeight + rowGap;
        });
      }

      const pageCount = doc.internal.getNumberOfPages();
      for (let p = 1; p <= pageCount; p++){
        doc.setPage(p);
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(9);
        doc.setTextColor(154, 166, 196);
        doc.text('Generated by Student Absentees Tracker', marginX, pageHeight - 26);
        doc.text(`Page ${p} of ${pageCount}`, pageWidth - marginX, pageHeight - 26, { align: 'right' });
      }

      const fileName = `absentees-${date}.pdf`;
      const blob = doc.output('blob');
      const file = new File([blob], fileName, { type: 'application/pdf' });

      if (navigator.canShare && navigator.canShare({ files: [file] })){
        try{
          await navigator.share({ files: [file], title: 'Absentees List', text: `Absentees List — ${day}, ${date}` });
          toast.fire('Shared successfully');
        }catch(err){
          if (err && err.name !== 'AbortError'){ downloadBlob(blob, fileName); toast.fire('PDF downloaded'); }
        }
      } else {
        downloadBlob(blob, fileName);
        toast.fire('PDF downloaded');
      }
    }catch(err){
      console.error(err); toast.fire('Something went wrong');
    }
    setSharingPDF(false);
  }
  function downloadBlob(blob, fileName){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fileName;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }

  return (
    <React.Fragment>
      <div className="topbar">
        <div className="topbar-row">
          <div className="brand">
            <span className="mark"><Icon name="cap" /></span>
            <div>
              <h1>Absentees Tracker</h1>
              <div className="date-pill">{day.toUpperCase()} · {date}</div>
            </div>
          </div>
          {activePage === 'students' && (
            <div style={{ display:'flex', gap:8 }}>
              <button className={"icon-btn" + (searchOpen ? " active" : "")} onClick={() => setSearchOpen(v => !v)} aria-label="Search">
                <Icon name="search" />
              </button>
            </div>
          )}
        </div>
        {activePage === 'students' && searchOpen && (
          <div className="search-wrap">
            <Icon name="search" />
            <input autoFocus placeholder="Search by name or roll no." value={search} onChange={e => setSearch(e.target.value)} />
          </div>
        )}
      </div>

      {!isConfigured && (
        <div id="configBanner" style={{ display:'block' }}>
          <strong>Supabase not configured.</strong> Set <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code> near the top of the script, then run <code>supabase-setup.sql</code>.
        </div>
      )}

      {(!isOnline || pendingCount > 0) && (
        <div className="offline-banner">
          <Icon name="offline" />
          <span>
            {!isOnline ? 'Offline — ' : ''}
            {pendingCount > 0
              ? `${pendingCount} change${pendingCount === 1 ? '' : 's'} will sync ${isOnline ? 'shortly' : 'when back online'}`
              : 'showing last saved data'}
          </span>
        </div>
      )}

      <div className="content">
        {activePage === 'students' ? (
          <div className="section">
            <div className="section-head">
              <h2>All Students <span className="count">{students.length}</span></h2>
              <div style={{ display:'flex', gap:8 }}>
                <span className="sort-chip" onClick={() => setSortAsc(v => !v)}>
                  Roll <Icon name="sortAsc" />
                </span>
                <span
                  className={"manage-chip" + (manageMode ? " active" : "")}
                  onClick={() => setManageMode(v => !v)}
                >
                  {manageMode ? 'Done' : 'Manage'}
                </span>
              </div>
            </div>

            {manageMode && (
              <div className="manage-banner">
                <Icon name="trash" />
                Tap a student to remove them from the list
              </div>
            )}

            {loadingStudents ? (
              <div className="spinner"></div>
            ) : visibleStudents.length === 0 ? (
              <div className="empty-state">
                <div className="glyph"><Icon name="cap" /></div>
                <p>{students.length === 0 ? 'No students yet' : 'No matches found'}</p>
                <span>{students.length === 0 ? 'Tap the + button to add one' : 'Try a different search'}</span>
              </div>
            ) : (
              <div id="studentsGrid">
                {visibleStudents.map((s, i) => (
                  <StudentCard
                    key={s.id}
                    student={s}
                    isAbsent={absentIds.has(s.id)}
                    index={i}
                    manageMode={manageMode}
                    onToggle={handleToggleAbsent}
                    onDelete={handleDeleteStudent}
                  />
                ))}
              </div>
            )}
          </div>
        ) : (
          <div className="section">
            <div className="section-head">
              <h2>Absent Today <span className="count red">{absentees.length}</span></h2>
            </div>

            <div id="absentCard">
              <div className="report-head">
                <h3 className="report-title">Absentees List</h3>
                <div className="report-date">{day}, {date} · Total {absentees.length}</div>
              </div>

              {loadingAbsent ? (
                <div className="spinner"></div>
              ) : absentees.length === 0 ? (
                <div className="empty-state">
                  <div className="glyph"><Icon name="check" /></div>
                  <p>No absentees yet</p>
                  <span>Tap a student on the Students page to mark them absent</span>
                </div>
              ) : (
                <ul id="absentList">
                  {sortedAbsentees.map((a, i) => (
                    <AbsentRow key={a.id} entry={a} index={i} onRemove={removeAbsentEntry} />
                  ))}
                </ul>
              )}

              <button className="btn btn-share" onClick={handleShare} disabled={sharing || absentees.length === 0}>
                <Icon name="share" />
                {sharing ? 'Preparing image…' : 'Share as image'}
              </button>
              <button className="btn btn-share-text" onClick={handleShareText} disabled={sharingText || absentees.length === 0}>
                <Icon name="file" />
                {sharingText ? 'Preparing text…' : 'Share as text'}
              </button>
              <button className="btn btn-share-pdf" onClick={handleSharePDF} disabled={sharingPDF || absentees.length === 0}>
                <Icon name="file" />
                {sharingPDF ? 'Preparing PDF…' : 'Share as PDF'}
                <span className="pdf-badge">HD</span>
              </button>
            </div>
          </div>
        )}
      </div>

      <ExportCard absentees={sortedAbsentees} date={date} day={day} />

      {activePage === 'students' && (
        <button className="fab" onClick={() => setSheetOpen(true)} aria-label="Add student">
          <Icon name="plus" />
        </button>
      )}

      <div className="tabbar">
        <button
          className={"tabbar-btn" + (activePage === 'students' ? " active" : "")}
          onClick={() => setActivePage('students')}
        >
          <Icon name="cap" />
          <span>Students</span>
          <span className="tabbar-count">{students.length}</span>
        </button>
        <button
          className={"tabbar-btn" + (activePage === 'absent' ? " active" : "")}
          onClick={() => setActivePage('absent')}
        >
          <Icon name="file" />
          <span>Absent Today</span>
          <span className="tabbar-count red">{absentees.length}</span>
        </button>
      </div>

      <AddSheet
        open={sheetOpen}
        onClose={() => setSheetOpen(false)}
        onSave={handleAddStudent}
        existingRolls={existingRolls}
      />

      <Toast msg={toast.msg} show={toast.show} />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
  // When a newly-installed service worker takes over (e.g. after a
  // redeploy), reload once so the page picks up the fresh app shell
  // instead of silently continuing to run the old cached version.
  let refreshed = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (refreshed) return;
    refreshed = true;
    window.location.reload();
  });
}
</script>

  // Manually transform the JSX source with the classic runtime.
  // (Avoids Babel's newer "automatic" runtime, which injects an
  // `import` statement that a plain, non-module script can't run.)
  const __src = document.getElementById('app-source').textContent;
  const __out = Babel.transform(__src, {
    presets: [['react', { runtime: 'classic' }]]
  }).code;
  const __script = document.createElement('script');
  __script.text = __out;
  document.body.appendChild(__script);
</script>
