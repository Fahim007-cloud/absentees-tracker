  .btn-primary{

  .btn-danger-outline{

  .brand .role-pill{

  .icon-btn{
    width:38px; height:38px; border-radius:12px;

  .segmented{
    display:flex; background: var(--indigo-tint); border-radius:14px; padding:4px; margin-bottom:16px;

<script type="text/plain" id="app-source">
const { useState, useEffect, useRef, useMemo } = React;

// ============================================================
// SUPABASE CONFIG — same project as the rest of the app suite.
// ============================================================
const SUPABASE_URL = 'https://nwqhigskbldybobcdrgv.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_RrNiWXYkZn1RJyb3z9Idzg_tn6QAdeO';
const isConfigured = SUPABASE_URL.startsWith('https://') && SUPABASE_ANON_KEY.length > 10;
const db = isConfigured ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

// ---------------- shared helpers ----------------
function todayInfo(){
  const d = new Date();
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off*60000);
  const date = local.toISOString().slice(0,10);
  const day = d.toLocaleDateString('en-US', { weekday: 'long' });
  return { date, day };
}
function dayOfWeek(dateStr){
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return dt.toLocaleDateString('en-US', { weekday: 'long' });
}
function formatDisplayDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  const dt = new Date(Number(y), Number(m)-1, Number(d));
  return dt.toLocaleDateString('en-US', { day:'2-digit', month:'short', year:'numeric' });
}
function initials(name){
  return name.trim().split(/\s+/).slice(0,2).map(w => w[0]?.toUpperCase() || '').join('');
}
function rollCompare(a, b){
  const na = parseFloat(a), nb = parseFloat(b);
  if (!isNaN(na) && !isNaN(nb) && String(na) === a.trim() && String(nb) === b.trim()) return na - nb;
  return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
}
function roleLabel(role){
  if (role === 'admin') return 'Admin';
  if (role === 'teacher') return 'Teacher';
  if (role === 'representative') return 'Representative';
  return role;
}
const BULK_LABELS = { present: 'Present', absent: 'Absent', od: 'OD (On Duty)', unmark: 'Not Marked' };
function exportStudentsCSV(students){
  const esc = (v) => `"${String(v).replace(/"/g, '""')}"`;
  const rows = [['Name', 'Roll No'], ...students.map(s => [s.name, s.roll_no])];
  const csv = rows.map(r => r.map(esc).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'student-list.csv';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function exportStudentsPDF(students){
  if (typeof window.jspdf === 'undefined') return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  const marginX = 42;
  const bottomLimit = pageHeight - 56;
  let y = 58;

  doc.setFont('helvetica', 'bold'); doc.setFontSize(19);
  doc.setTextColor(27, 37, 64);
  doc.text('Student List', marginX, y);
  y += 20;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(11);
  doc.setTextColor(94, 107, 140);
  doc.text(`Total ${students.length} student${students.length === 1 ? '' : 's'}`, marginX, y);
  y += 28;

  const sorted = [...students].sort((a,b) => rollCompare(a.roll_no, b.roll_no));
  const rowHeight = 26;
  const rowWidth = pageWidth - marginX * 2;

  sorted.forEach((s, i) => {
    if (y + rowHeight > bottomLimit){ doc.addPage(); y = 58; }
    if (i % 2 === 1){ doc.setFillColor(246, 248, 253); doc.rect(marginX, y, rowWidth, rowHeight, 'F'); }
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
    doc.setTextColor(27, 37, 64);
    doc.text(s.name, marginX + 8, y + 17);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
    doc.setTextColor(94, 107, 140);
    doc.text(`Roll ${s.roll_no}`, marginX + rowWidth - 8, y + 17, { align: 'right' });
    y += rowHeight;
  });

  const pageCount = doc.internal.getNumberOfPages();
  for (let p = 1; p <= pageCount; p++){
    doc.setPage(p);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
    doc.setTextColor(154, 166, 196);
    doc.text('Generated by Student Absentees Tracker', marginX, pageHeight - 26);
    doc.text(`Page ${p} of ${pageCount}`, pageWidth - marginX, pageHeight - 26, { align: 'right' });
  }

  doc.save('student-list.pdf');
}

function useToast(){
  const [msg, setMsg] = useState('');
  const [show, setShow] = useState(false);
  const timer = useRef(null);
  const fire = (text) => {
    setMsg(text); setShow(true);
    clearTimeout(timer.current);
    timer.current = setTimeout(() => setShow(false), 2600);
  };
  return { msg, show, fire };
}
function Toast({ msg, show }){
  return <div className={"toast" + (show ? " show" : "")}>{msg}</div>;
}

  const paths = {
    cap: <><path d="M22 10L12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/></>,

    logout: <><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></>,
    users: <><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>,
    file: <><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></>,
    calendar: <><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></>,
    download: <><path d="M12 3v13"/><path d="M7 11l5 5 5-5"/><path d="M5 21h14"/></>,
    share: <><path d="M12 3v13"/><path d="M7 8l5-5 5 5"/><path d="M5 21h14"/></>,
    check: <path d="M20 6L9 17l-5-5"/>,
    chevronRight: <path d="M9 18l6-6-6-6"/>,
    briefcase: <><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></>,
    lock: <><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></>,
    mail: <><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 6 10-6"/></>
  };
  return (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.1" strokeLinecap="round" strokeLinejoin="round" {...props}>
      {paths[name]}
    </svg>
  );
}

// ---------------- Custom date picker ----------------
function parseDateStr(str){
  const [y, m, d] = str.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function formatDateStr(d){
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function DatePicker({ value, onChange, max, min }){
  const [open, setOpen] = useState(false);
  const [viewMonth, setViewMonth] = useState(() => {
    const d = value ? parseDateStr(value) : new Date();
    return new Date(d.getFullYear(), d.getMonth(), 1);
  });

  useEffect(() => {
    if (open){
      const d = value ? parseDateStr(value) : new Date();
      setViewMonth(new Date(d.getFullYear(), d.getMonth(), 1));
    }
  }, [open]);

  const selectedDate = value ? parseDateStr(value) : null;
  const maxDate = max ? parseDateStr(max) : null;
  const minDate = min ? parseDateStr(min) : null;
  const today = new Date();

  const year = viewMonth.getFullYear();
  const month = viewMonth.getMonth();
  const firstWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const cells = [];
  for (let i = 0; i < firstWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  function isDisabled(d){
    const dt = new Date(year, month, d);
    if (maxDate && dt > maxDate) return true;
    if (minDate && dt < minDate) return true;
    return false;
  }
  function isSelected(d){
    return !!selectedDate && selectedDate.getFullYear() === year && selectedDate.getMonth() === month && selectedDate.getDate() === d;
  }
  function isToday(d){
    return today.getFullYear() === year && today.getMonth() === month && today.getDate() === d;
  }
  function selectDay(d){
    if (isDisabled(d)) return;
    onChange(formatDateStr(new Date(year, month, d)));
    setOpen(false);
  }

  const nextMonthDisabled = maxDate && year === maxDate.getFullYear() && month === maxDate.getMonth();
  const monthLabel = viewMonth.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

  return (
    <React.Fragment>
      <button type="button" className="datepicker-trigger" onClick={() => setOpen(true)}>
        <Icon name="calendar" />
        <span className={value ? '' : 'dp-placeholder'}>{value ? formatDisplayDate(value) : 'Select date'}</span>
      </button>

      {open && (
        <React.Fragment>
          <div className="datepicker-backdrop" onClick={() => setOpen(false)}></div>
          <div className="datepicker-popup">
            <div className="datepicker-header">
              <button type="button" onClick={() => setViewMonth(new Date(year, month - 1, 1))} aria-label="Previous month">
                <Icon name="chevronRight" style={{ transform: 'rotate(180deg)' }} />
              </button>
              <span>{monthLabel}</span>
              <button type="button" onClick={() => setViewMonth(new Date(year, month + 1, 1))} disabled={nextMonthDisabled} aria-label="Next month">
                <Icon name="chevronRight" />
              </button>
            </div>
            <div className="datepicker-weekdays">
              {['S','M','T','W','T','F','S'].map((w, i) => <span key={i}>{w}</span>)}
            </div>
            <div className="datepicker-grid">
              {cells.map((d, i) => d === null ? <span key={i}></span> : (
                <button
                  type="button" key={i}
                  className={"datepicker-day" + (isSelected(d) ? " selected" : "") + (isToday(d) && !isSelected(d) ? " today" : "")}
                  disabled={isDisabled(d)}
                  onClick={() => selectDay(d)}
                >{d}</button>
              ))}
            </div>
            <div className="datepicker-footer">
              <button
                type="button"
                className="datepicker-today-btn"
                onClick={() => { if (!maxDate || today <= maxDate) onChange(formatDateStr(today)); setOpen(false); }}
              >Today</button>
            </div>
          </div>
        </React.Fragment>
      )}
    </React.Fragment>
  );
}

function RepresentativeDashboard({ toast }){
  const { date, day } = useMemo(todayInfo, []);
  const [tab, setTab] = useState('mark');
  const [students, setStudents] = useState([]);
  const [records, setRecords] = useState([]); // today's attendance records
  const [loading, setLoading] = useState(true);
  const [addOpen, setAddOpen] = useState(false);
  const [name, setName] = useState('');
  const [roll, setRoll] = useState('');
  const [saving, setSaving] = useState(false);
  const [sharingImg, setSharingImg] = useState(false);
  const [sharingTxt, setSharingTxt] = useState(false);
  const [shareFilter, setShareFilter] = useState('both'); // 'both' | 'morning' | 'afternoon'
  const [todayHoliday, setTodayHoliday] = useState(null);

  const [prevDate, setPrevDate] = useState(date);
  const [prevRecords, setPrevRecords] = useState([]);
  const [prevLoading, setPrevLoading] = useState(false);

  const [fromDate, setFromDate] = useState(date);
  const [toDate, setToDate] = useState(date);
  const [report, setReport] = useState(null);
  const [generating, setGenerating] = useState(false);
  const [pdfBusy, setPdfBusy] = useState(false);

  useEffect(() => { if (tab === 'previous') loadPrevRecords(prevDate); }, [tab, prevDate]);

  async function loadPrevRecords(d){
    setPrevLoading(true);
    const { data, error } = await db.from('atrk_attendance').select('*').eq('date', d);
    setPrevLoading(false);
    if (error){ toast.fire('Could not load that date'); console.error(error); return; }
    setPrevRecords(data || []);
  }

  async function handleDeleteStudent(student){
    if (!window.confirm(`Remove ${student.name}? This also clears their attendance history.`)) return;
    const { error } = await db.from('atrk_students').delete().eq('id', student.id);
    if (error){ toast.fire('Could not delete student'); console.error(error); return; }
    setStudents(prev => prev.filter(s => s.id !== student.id));
    setRecords(prev => prev.filter(r => r.student_id !== student.id));
    toast.fire(`${student.name} removed`);
  }

  useEffect(() => { loadAll(); }, []);

  async function loadAll(){
    setLoading(true);
    const [s, a, h] = await Promise.all([
      db.from('atrk_students').select('*').order('name', { ascending: true }),
      db.from('atrk_attendance').select('*').eq('date', date),
      db.from('atrk_holidays').select('*').eq('date', date)
    ]);
    setLoading(false);
    if (s.error) console.error(s.error); else setStudents(s.data || []);
    if (a.error) console.error(a.error); else setRecords(a.data || []);
    if (h.error) console.error(h.error); else setTodayHoliday((h.data && h.data[0]) || null);
  }

  const recordMap = useMemo(() => {
    const m = {};
    records.forEach(r => { m[r.student_id] = r; });
    return m;
  }, [records]);

  async function markSession(student, session, newStatus){
    const existing = recordMap[student.id] || null;
    let morning_status = existing ? existing.morning_status : null;
    let afternoon_status = existing ? existing.afternoon_status : null;
    let afternoon_manual = existing ? existing.afternoon_manual : false;

    if (session === 'morning'){
      morning_status = newStatus;
      // Auto-fill: mirror Morning into Afternoon immediately, but only
      // as long as Afternoon has never been edited by hand.
      if (!afternoon_manual) afternoon_status = newStatus;
    } else {
      afternoon_status = newStatus;
      afternoon_manual = true; // manual edits are never overwritten again
    }

    const payload = { student_id: student.id, name: student.name, roll_no: student.roll_no, date, day, morning_status, afternoon_status, afternoon_manual };

    setRecords(prev => {
      const without = prev.filter(r => r.student_id !== student.id);
      return [...without, { id: existing ? existing.id : ('temp-' + student.id), ...payload }];
    });

    const { data, error } = await db.from('atrk_attendance')
      .upsert([payload], { onConflict: 'student_id,date' })
      .select();
    if (error){ console.error(error); toast.fire('Could not update — try again'); loadAll(); return; }
    if (data && data[0]) setRecords(prev => prev.map(r => r.student_id === student.id ? data[0] : r));
  }

  async function handleAddStudent(){
    if (!name.trim() || !roll.trim()) return;
    setSaving(true);
    const { data, error } = await db.from('atrk_students').insert([{ name: name.trim(), roll_no: roll.trim() }]).select();
    setSaving(false);
    if (error){
      if (error.code === '23505') toast.fire(`Roll number ${roll} already exists`);
      else { toast.fire('Could not add student'); console.error(error); }
      return;
    }
    if (data && data[0]) setStudents(prev => [...prev, data[0]].sort((a,b) => a.name.localeCompare(b.name)));
    setName(''); setRoll(''); setAddOpen(false);
    toast.fire(`${name} added`);
  }


  async function handleGenerateReport(){
    if (!fromDate || !toDate){ toast.fire('Pick both dates'); return; }
    if (fromDate > toDate){ toast.fire('"From" date must be before "To" date'); return; }
    setGenerating(true);
    const [attRes, holRes] = await Promise.all([
      db.from('atrk_attendance').select('*').gte('date', fromDate).lte('date', toDate),
      db.from('atrk_holidays').select('date').gte('date', fromDate).lte('date', toDate)
    ]);
    setGenerating(false);
    if (attRes.error){ toast.fire('Could not generate report'); console.error(attRes.error); return; }
    if (holRes.error){ console.error(holRes.error); }

    const holidayDates = new Set((holRes.data || []).map(h => h.date));
    const recordsInRange = (attRes.data || []).filter(r => !holidayDates.has(r.date));
    const sessionDates = [...new Set(recordsInRange.map(r => r.date))];
    const totalHalfDays = sessionDates.length * 2;

    const rows = students.map(s => {
      const mine = recordsInRange.filter(r => r.student_id === s.id);
      const absentHalf = mine.filter(r => r.morning_status === 'absent').length + mine.filter(r => r.afternoon_status === 'absent').length;
      const odHalf = mine.filter(r => r.morning_status === 'od').length + mine.filter(r => r.afternoon_status === 'od').length;      const unmarkedHalf = mine.reduce((n, r) => n + (r.morning_status === 'unmarked' ? 1 : 0) + (r.afternoon_status === 'unmarked' ? 1 : 0), 0);
      const presentHalf = Math.max(0, totalHalfDays - absentHalf - odHalf - unmarkedHalf);
      const countedHalfDays = totalHalfDays - unmarkedHalf; // Not Marked half-days are excluded, like holidays
      const percentage = countedHalfDays <= 0 ? null : Math.round(((presentHalf + odHalf) / countedHalfDays) * 1000) / 10;
      return {
        ...s,
        present: Math.round((presentHalf / 2) * 10) / 10,
        absent: Math.round((absentHalf / 2) * 10) / 10,
        od: Math.round((odHalf / 2) * 10) / 10,
        percentage
      };
    }).sort((a,b) => rollCompare(a.roll_no, b.roll_no));

    setReport({ fromDate, toDate, totalSessions: sessionDates.length, rows, holidaysExcluded: holidayDates.size });
  }

  async function handleDownloadPDF(){
    if (!report) return;
    if (typeof window.jspdf === 'undefined'){ toast.fire('Could not load PDF tool'); return; }
    setPdfBusy(true);
    try{
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'pt', format: 'a4' });
      const pageWidth = doc.internal.pageSize.getWidth();
      const pageHeight = doc.internal.pageSize.getHeight();
      const marginX = 40;
      const bottomLimit = pageHeight - 56;
      let y = 56;

      doc.setFont('helvetica', 'bold'); doc.setFontSize(19);
      doc.setTextColor(27, 37, 64);
      doc.text('Attendance Report', marginX, y);
      y += 20;
      doc.setFont('helvetica', 'normal'); doc.setFontSize(11);
      doc.setTextColor(94, 107, 140);
      doc.text(`${formatDisplayDate(report.fromDate)} \u2013 ${formatDisplayDate(report.toDate)}  \u00b7  ${report.totalSessions} session${report.totalSessions === 1 ? '' : 's'}`, marginX, y);
      y += 26;

      const cols = [
        { label: 'Name', w: 150, align: 'left' },
        { label: 'Roll', w: 55, align: 'left' },
        { label: 'Present', w: 60, align: 'center' },
        { label: 'Absent', w: 60, align: 'center' },
        { label: 'OD', w: 45, align: 'center' },
        { label: '%', w: 55, align: 'center' }
      ];
      const tableWidth = cols.reduce((s,c) => s + c.w, 0);

      function drawHeader(){
        doc.setFillColor(27, 37, 64);
        doc.rect(marginX, y, tableWidth, 26, 'F');
        let x = marginX;
        doc.setFont('helvetica', 'bold'); doc.setFontSize(10);
        doc.setTextColor(255,255,255);
        cols.forEach(c => {
          doc.text(c.label, c.align === 'left' ? x + 8 : x + c.w/2, y + 17, { align: c.align === 'left' ? 'left' : 'center' });
          x += c.w;
        });
        y += 26;
      }

      drawHeader();
      report.rows.forEach((r, i) => {
        if (y + 24 > bottomLimit){ doc.addPage(); y = 56; drawHeader(); }
        if (i % 2 === 1){ doc.setFillColor(246, 248, 253); doc.rect(marginX, y, tableWidth, 24, 'F'); }
        let x = marginX;
        doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
        doc.setTextColor(27, 37, 64);
        const cells = [r.name, r.roll_no, String(r.present), String(r.absent), String(r.od), r.percentage === null ? '\u2014' : r.percentage + '%'];
        cells.forEach((val, ci) => {
          const c = cols[ci];
          doc.text(String(val), c.align === 'left' ? x + 8 : x + c.w/2, y + 16, { align: c.align === 'left' ? 'left' : 'center' });
          x += c.w;
        });
        y += 24;
      });

      const pageCount = doc.internal.getNumberOfPages();
      for (let p = 1; p <= pageCount; p++){
        doc.setPage(p);
        doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
        doc.setTextColor(154, 166, 196);
        doc.text('Generated by Student Absentees Tracker', marginX, pageHeight - 26);
        doc.text(`Page ${p} of ${pageCount}`, pageWidth - marginX, pageHeight - 26, { align: 'right' });
      }

      doc.save(`attendance-report-${report.fromDate}-to-${report.toDate}.pdf`);
      toast.fire('PDF downloaded');
    }catch(err){
      console.error(err); toast.fire('Something went wrong');
    }
    setPdfBusy(false);
  }

  async function handleDownloadExcel(){
    if (!report) return;
    if (typeof ExcelJS === 'undefined'){ toast.fire('Could not load Excel tool'); return; }
    try{
      const wb = new ExcelJS.Workbook();
      wb.creator = 'Student Absentees Tracker';
      const ws = wb.addWorksheet('Attendance Report', { views: [{ state: 'frozen', ySplit: 4 }] });
      ws.columns = [{ width: 24 }, { width: 10 }, { width: 11 }, { width: 11 }, { width: 8 }, { width: 12 }];

      ws.mergeCells('A1:F1');
      const titleCell = ws.getCell('A1');
      titleCell.value = 'Attendance Report';
      titleCell.font = { name: 'Calibri', size: 16, bold: true, color: { argb: 'FFFFFFFF' } };
      titleCell.alignment = { vertical: 'middle' };
      ws.getRow(1).height = 28;
      ws.getRow(1).eachCell(c => { c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF3E62E8' } }; });

      ws.mergeCells('A2:F2');
      const subCell = ws.getCell('A2');
      const holidayNote = report.holidaysExcluded > 0 ? `  \u00b7  ${report.holidaysExcluded} holiday${report.holidaysExcluded === 1 ? '' : 's'} excluded` : '';
      subCell.value = `${formatDisplayDate(report.fromDate)} \u2013 ${formatDisplayDate(report.toDate)}  \u00b7  ${report.totalSessions} session${report.totalSessions === 1 ? '' : 's'}${holidayNote}`;
      subCell.font = { name: 'Calibri', size: 10.5, italic: true, color: { argb: 'FF5E6B8C' } };
      ws.getRow(2).eachCell(c => { c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFEEF2FE' } }; });
      ws.getRow(2).height = 20;

      const thinLine = (argb) => ({ style: 'thin', color: { argb } });
      const headerRow = ws.getRow(4);
      headerRow.values = ['Name', 'Roll No', 'Present', 'Absent', 'OD', 'Percentage'];
      headerRow.eachCell(c => {
        c.font = { bold: true, color: { argb: 'FFFFFFFF' }, size: 11 };
        c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF2B47C4' } };
        c.alignment = { vertical: 'middle', horizontal: 'center' };
        c.border = { top: thinLine('FFDCE5FB'), bottom: thinLine('FFDCE5FB'), left: thinLine('FFDCE5FB'), right: thinLine('FFDCE5FB') };
      });
      headerRow.height = 20;

      report.rows.forEach((r, i) => {
        const row = ws.addRow([r.name, r.roll_no, r.present, r.absent, r.od, r.percentage === null ? '\u2014' : r.percentage / 100]);
        const isEven = i % 2 === 1;
        row.eachCell((c, colNumber) => {
          c.border = { top: thinLine('FFE4E9F7'), bottom: thinLine('FFE4E9F7'), left: thinLine('FFE4E9F7'), right: thinLine('FFE4E9F7') };
          c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: isEven ? 'FFF6F8FD' : 'FFFFFFFF' } };
          c.font = { size: 10.5, color: { argb: 'FF1B2540' } };
          if (colNumber >= 3) c.alignment = { horizontal: 'center' };
        });
        row.getCell(1).font = { size: 10.5, bold: true, color: { argb: 'FF1B2540' } };
        row.getCell(1).alignment = { horizontal: 'left' };
        row.getCell(4).font = { size: 10.5, color: { argb: 'FFE0525F' } };
        row.getCell(5).font = { size: 10.5, color: { argb: 'FFD98A2B' } };
        const pctCell = row.getCell(6);
        if (r.percentage !== null){
          pctCell.numFmt = '0.0%';
          pctCell.font = { size: 10.5, bold: true, color: { argb: r.percentage < 75 ? 'FFE0525F' : 'FF2FA36B' } };
        }
      });

      const buffer = await wb.xlsx.writeBuffer();
      const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `attendance-report-${report.fromDate}-to-${report.toDate}.xlsx`;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      toast.fire('Excel file downloaded');
    }catch(err){
      console.error(err);
      toast.fire('Could not create Excel file');
    }
  }
  const morningAbsent = useMemo(
    () => [...records].filter(r => r.morning_status === 'absent').sort((a,b) => rollCompare(a.roll_no, b.roll_no)),
    [records]
  );
  const morningOd = useMemo(
    () => [...records].filter(r => r.morning_status === 'od').sort((a,b) => rollCompare(a.roll_no, b.roll_no)),
    [records]
  );
  const afternoonAbsent = useMemo(
    () => [...records].filter(r => r.afternoon_status === 'absent').sort((a,b) => rollCompare(a.roll_no, b.roll_no)),
    [records]
  );
  const afternoonOd = useMemo(
    () => [...records].filter(r => r.afternoon_status === 'od').sort((a,b) => rollCompare(a.roll_no, b.roll_no)),
    [records]
  );

  function sessionBlockLines(label, absent, od){
    const lines = [label, `Absent (${absent.length})`];
    if (absent.length === 0) lines.push('None');
    else absent.forEach((a, i) => lines.push(`${String(i+1).padStart(2,'0')}. ${a.name} — Roll ${a.roll_no}`));
    lines.push('', `OD (${od.length})`);
    if (od.length === 0) lines.push('None');
    else od.forEach((a, i) => lines.push(`${String(i+1).padStart(2,'0')}. ${a.name} — Roll ${a.roll_no}`));
    return lines;
  }

  function buildReportText(){
    const lines = ['ATTENDANCE REPORT', `${day}, ${date}`, ''];
    if (shareFilter !== 'afternoon') lines.push(...sessionBlockLines('MORNING', morningAbsent, morningOd), '');
    if (shareFilter !== 'morning') lines.push(...sessionBlockLines('AFTERNOON', afternoonAbsent, afternoonOd), '');
    lines.push('Generated by Student Absentees Tracker');
    return lines.join('\n');
  }

  async function handleShareText(){
    setSharingTxt(true);
    const text = buildReportText();
    try{
      if (navigator.share){
        try{ await navigator.share({ title: 'Attendance Report', text }); toast.fire('Shared successfully'); }
        catch(err){ if (err && err.name !== 'AbortError') await copyFallback(text); }
      } else {
        await copyFallback(text);
      }
    }catch(err){ console.error(err); toast.fire('Something went wrong'); }
    setSharingTxt(false);
  }
  async function copyFallback(text){
    if (navigator.clipboard && navigator.clipboard.writeText){
      try{ await navigator.clipboard.writeText(text); toast.fire('Copied to clipboard'); return; }catch(e){}
    }
    const blob = new Blob([text], { type:'text/plain' });
    downloadBlob(blob, `attendance-${date}.txt`);
    toast.fire('Text file downloaded');
  }
  function downloadBlob(blob, fileName){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fileName;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }

  async function handleShareImage(){
    if (typeof html2canvas === 'undefined'){ toast.fire('Could not load image tool'); return; }
    setSharingImg(true);
    try{
      const el = document.getElementById('repExportCard');
      const naturalHeight = el.scrollHeight;
      const MAX_CANVAS_HEIGHT = 6000;
      const scale = Math.max(0.5, Math.min(2, MAX_CANVAS_HEIGHT / naturalHeight));
      const canvas = await html2canvas(el, { backgroundColor:'#ffffff', scale, useCORS:true });
      canvas.toBlob(async (blob) => {
        if (!blob){ toast.fire('Could not create image'); setSharingImg(false); return; }
        const fileName = `attendance-${date}.png`;
        const file = new File([blob], fileName, { type:'image/png' });
        if (navigator.canShare && navigator.canShare({ files:[file] })){
          try{ await navigator.share({ files:[file], title:'Attendance Report' }); toast.fire('Shared successfully'); }
          catch(err){ if (err && err.name !== 'AbortError'){ downloadBlob(blob, fileName); toast.fire('Image downloaded'); } }
        } else {
          downloadBlob(blob, fileName); toast.fire('Image downloaded');
        }
        setSharingImg(false);
      }, 'image/png');
    }catch(err){ console.error(err); toast.fire('Something went wrong'); setSharingImg(false); }
  }

  return (
    <div className="content">
      <div className="segmented">
        <button className={tab === 'mark' ? 'active' : ''} onClick={() => setTab('mark')}>Mark</button>
        <button className={tab === 'lists' ? 'active' : ''} onClick={() => setTab('lists')}>Today's Lists</button>
        <button className={tab === 'previous' ? 'active' : ''} onClick={() => setTab('previous')}>Previous</button>
        <button className={tab === 'reports' ? 'active' : ''} onClick={() => setTab('reports')}>Reports</button>
        <button className={tab === 'manage' ? 'active' : ''} onClick={() => setTab('manage')}>Manage</button>
      </div>

      {tab === 'mark' && (
        <div>
          {todayHoliday ? (
            <div className="card" style={{ textAlign:'center', padding:'32px 20px' }}>
              <div className="glyph" style={{ marginBottom:12 }}><Icon name="calendar" /></div>
              <div style={{ fontFamily:'Sora, sans-serif', fontWeight:700, fontSize:16, marginBottom:6 }}>Today is a holiday</div>
              <div style={{ fontSize:13, color:'var(--ink-soft)' }}>{todayHoliday.reason}</div>
              <div style={{ fontSize:11.5, color:'var(--ink-faint)', marginTop:10 }}>Attendance marking is disabled for holidays</div>
            </div>
          ) : (
            <React.Fragment>
              <div className="section-head">
                <h2>All Students <span className="count">{students.length}</span></h2>
                <button className="btn btn-outline" style={{ padding:'7px 12px', fontSize:12.5 }} onClick={() => setAddOpen(v => !v)}>
                  <Icon name="plus" /> Add
                </button>
              </div>

              <div style={{ display:'flex', alignItems:'center', gap:8, background:'var(--indigo-tint)', border:'1px solid var(--indigo-line)', borderRadius:12, padding:'9px 12px', marginBottom:14, fontSize:11.5, color:'var(--indigo-deep)' }}>
                Tap AM or PM on a student to set that session's status. Marking Morning auto-fills Afternoon to match — unless Afternoon has been edited by hand, which locks it from auto-fill for the day.
              </div>

              {addOpen && (
                <div className="card">
                  <div className="row-2">
                    <div className="field">
                      <label>Name</label>
                      <input value={name} onChange={e => setName(e.target.value)} placeholder="e.g. Aarav Mehta" />
                    </div>
                    <div className="field">
                      <label>Roll no.</label>
                      <input value={roll} onChange={e => setRoll(e.target.value)} placeholder="e.g. 24" />
                    </div>
                  </div>
                  <button className="btn btn-primary" style={{ width:'100%' }} onClick={handleAddStudent} disabled={saving}>
                    {saving ? 'Saving…' : 'Save student'}
                  </button>
                </div>
              )}

              {loading ? <div className="spinner"></div> : students.length === 0 ? (
                <div className="empty-state">
                  <div className="glyph"><Icon name="cap" /></div>
                  <p>No students yet</p>

                <div style={{ display:'grid', gridTemplateColumns:'repeat(2, 1fr)', gap:10 }}>
                  {[...students].sort((a,b) => rollCompare(a.roll_no, b.roll_no)).map((s, i) => (
                    <SessionStudentTile key={s.id} student={s} record={recordMap[s.id]} index={i} onMarkSession={markSession} />

      {tab === 'lists' && (
        <div>

            <button className={shareFilter === 'both' ? 'active' : ''} onClick={() => setShareFilter('both')}>Both</button>
            <button className={shareFilter === 'morning' ? 'active' : ''} onClick={() => setShareFilter('morning')}>AM only</button>
            <button className={shareFilter === 'afternoon' ? 'active' : ''} onClick={() => setShareFilter('afternoon')}>PM only</button>

          <div id="repExportCard" style={{ background:'#fff', borderRadius:20, border:'1px solid var(--glass-border)', boxShadow:'var(--shadow-glass)', padding:18 }}>
            <div style={{ fontFamily:'Sora, sans-serif', fontWeight:700, fontSize:16 }}>Attendance Report</div>
            <div style={{ fontSize:11.5, color:'var(--ink-soft)', marginBottom:16 }}>{day}, {date}</div>

            {shareFilter !== 'afternoon' && <SessionListBlock title="Morning" absentList={morningAbsent} odList={morningOd} />}
            {shareFilter !== 'morning' && <SessionListBlock title="Afternoon" absentList={afternoonAbsent} odList={afternoonOd} />}
          </div>

          <button className="btn btn-primary" style={{ width:'100%', marginTop:14 }} onClick={handleShareImage} disabled={sharingImg}>
            <Icon name="share" />{sharingImg ? 'Preparing image…' : 'Share as image'}
          </button>
          <button className="btn btn-outline" style={{ width:'100%', marginTop:10 }} onClick={handleShareText} disabled={sharingTxt}>
            <Icon name="file" />{sharingTxt ? 'Preparing text…' : 'Share as text'}
          </button>
        </div>
      )}

      {tab === 'previous' && (
        <div>
          <div className="card">
            <div className="field">
              <label>Date</label>
              <DatePicker value={prevDate} max={date} onChange={setPrevDate} />
            </div>

              View-only — past attendance can't be edited here. Ask an Admin if a past date needs correcting.

          {prevLoading ? <div className="spinner"></div> : (
            <React.Fragment>
              <SessionListBlock
                title="Morning"
                absentList={[...prevRecords].filter(r => r.morning_status === 'absent').sort((a,b) => rollCompare(a.roll_no, b.roll_no))}
                odList={[...prevRecords].filter(r => r.morning_status === 'od').sort((a,b) => rollCompare(a.roll_no, b.roll_no))}
              />
              <SessionListBlock
                title="Afternoon"
                absentList={[...prevRecords].filter(r => r.afternoon_status === 'absent').sort((a,b) => rollCompare(a.roll_no, b.roll_no))}
                odList={[...prevRecords].filter(r => r.afternoon_status === 'od').sort((a,b) => rollCompare(a.roll_no, b.roll_no))}
              />
            </React.Fragment>
          )}
        </div>
      )}

      {tab === 'reports' && (
        <div>
          <div className="card">
            <div className="row-2">
              <div className="field">
                <label>From date</label>
                <DatePicker value={fromDate} max={date} onChange={setFromDate} />
              </div>
              <div className="field">
                <label>To date</label>

            <button className="btn btn-primary" style={{ width:'100%' }} onClick={handleGenerateReport} disabled={generating}>
              <Icon name="calendar" />
              {generating ? 'Generating…' : 'Generate report'}
            </button>
          </div>

          {report && (
            <div className="card">
              <div style={{ fontFamily:'Sora, sans-serif', fontWeight:700, fontSize:15.5, marginBottom:2 }}>Attendance Report</div>
              <div style={{ fontSize:11.5, color:'var(--ink-soft)', marginBottom:14 }}>
                {formatDisplayDate(report.fromDate)} – {formatDisplayDate(report.toDate)} · {report.totalSessions} session{report.totalSessions === 1 ? '' : 's'}
                {report.holidaysExcluded > 0 && ` · ${report.holidaysExcluded} holiday${report.holidaysExcluded === 1 ? '' : 's'} excluded`}
              </div>

              {report.rows.length === 0 ? (
                <div className="empty-state"><p>No students to report on.</p></div>
              ) : (
                <div style={{ overflowX:'auto' }}>
                  <table style={{ width:'100%', borderCollapse:'collapse', fontSize:12 }}>
                    <thead>
                      <tr style={{ textAlign:'left', color:'var(--ink-soft)' }}>
                        <th style={{ padding:'6px 8px' }}>Name</th>
                        <th style={{ padding:'6px 8px' }}>Roll</th>
                        <th style={{ padding:'6px 8px', textAlign:'center' }}>P</th>
                        <th style={{ padding:'6px 8px', textAlign:'center' }}>A</th>
                        <th style={{ padding:'6px 8px', textAlign:'center' }}>OD</th>
                        <th style={{ padding:'6px 8px', textAlign:'center' }}>%</th>
                      </tr>
                    </thead>
                    <tbody>
                      {report.rows.map(r => (
                        <tr key={r.id} style={{ borderTop:'1px solid var(--line)' }}>
                          <td style={{ padding:'8px', fontWeight:600 }}>{r.name}</td>
                          <td style={{ padding:'8px', color:'var(--ink-soft)' }}>{r.roll_no}</td>
                          <td style={{ padding:'8px', textAlign:'center' }}>{r.present}</td>
                          <td style={{ padding:'8px', textAlign:'center', color:'var(--red)' }}>{r.absent}</td>
                          <td style={{ padding:'8px', textAlign:'center', color:'var(--amber)' }}>{r.od}</td>
                          <td style={{ padding:'8px', textAlign:'center', fontWeight:600 }}>{r.percentage === null ? '—' : r.percentage + '%'}</td>
                        </tr>

                    </tbody>
                  </table>

              <button className="btn btn-outline" style={{ width:'100%', marginTop:14 }} onClick={handleDownloadPDF} disabled={pdfBusy}>
                <Icon name="download" />

              </button>
              <button className="btn btn-outline" style={{ width:'100%', marginTop:10 }} onClick={handleDownloadExcel}>
                <Icon name="download" />
                Download Excel
              </button>

      )}

      {tab === 'manage' && (
        <div>
          <div className="section-head">
            <h2>All Students <span className="count">{students.length}</span></h2>
            <div style={{ display:'flex', gap:8 }}>

                <Icon name="download" /> CSV
              </button>
              <button className="btn btn-outline" style={{ padding:'7px 12px', fontSize:12.5 }} onClick={() => exportStudentsPDF(students)}>
                <Icon name="download" /> PDF
              </button>
            </div>
          </div>

          {students.length === 0 ? (
            <div className="empty-state">
              <div className="glyph"><Icon name="cap" /></div>
              <p>No students yet</p>
            </div>
          ) : (
            <div style={{ display:'grid', gridTemplateColumns:'repeat(2, 1fr)', gap:10 }}>
              {[...students].sort((a,b) => rollCompare(a.roll_no, b.roll_no)).map(s => (
                <div key={s.id} className="card" style={{ padding:12, marginBottom:0, position:'relative' }}>
                  <div style={{ fontSize:13.5, fontWeight:600, paddingRight:20 }}>{s.name}</div>
                  <div style={{ fontSize:11, color:'var(--ink-soft)', marginTop:2 }}>Roll {s.roll_no}</div>
                  <button
                    onClick={() => handleDeleteStudent(s)}
                    style={{ position:'absolute', top:10, right:10, border:'none', background:'transparent', color:'var(--ink-faint)', cursor:'pointer' }}
                  >
                    <Icon name="trash" style={{ width:14, height:14 }} />
                  </button>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}
function TeacherDashboard({ toast }){
  const [tab, setTab] = useState('students');
  const [students, setStudents] = useState([]);
  const [loading, setLoading] = useState(true);
  const [addOpen, setAddOpen] = useState(false);
  const [name, setName] = useState('');
  const [roll, setRoll] = useState('');
  const [saving, setSaving] = useState(false);

  const { date: today, day: todayDay } = useMemo(todayInfo, []);
  const [fromDate, setFromDate] = useState(today);
  const [toDate, setToDate] = useState(today);
  const [report, setReport] = useState(null);
  const [generating, setGenerating] = useState(false);
  const [pdfBusy, setPdfBusy] = useState(false);

  const [markRecords, setMarkRecords] = useState([]);
  const [markLoading, setMarkLoading] = useState(false);
  const [todayHoliday, setTodayHoliday] = useState(null);

  useEffect(() => { if (tab === 'mark') loadMarkRecords(); }, [tab]);

  async function loadMarkRecords(){
    setMarkLoading(true);
    const [a, h] = await Promise.all([
      db.from('atrk_attendance').select('*').eq('date', today),
      db.from('atrk_holidays').select('*').eq('date', today)
    ]);
    setMarkLoading(false);
    if (a.error){ toast.fire('Could not load attendance'); console.error(a.error); return; }
    setMarkRecords(a.data || []);
    if (h.error) console.error(h.error); else setTodayHoliday((h.data && h.data[0]) || null);
  }

  const markRecordMap = useMemo(() => {
    const m = {};
    markRecords.forEach(r => { m[r.student_id] = r; });
    return m;
  }, [markRecords]);

  async function markSession(student, session, newStatus){
    const existing = markRecordMap[student.id] || null;
    let morning_status = existing ? existing.morning_status : null;
    let afternoon_status = existing ? existing.afternoon_status : null;
    let afternoon_manual = existing ? existing.afternoon_manual : false;

    if (session === 'morning'){
      morning_status = newStatus;
      if (!afternoon_manual) afternoon_status = newStatus;
    } else {
      afternoon_status = newStatus;
      afternoon_manual = true;
    }

    const payload = { student_id: student.id, name: student.name, roll_no: student.roll_no, date: today, day: todayDay, morning_status, afternoon_status, afternoon_manual };

    setMarkRecords(prev => {
      const without = prev.filter(r => r.student_id !== student.id);
      return [...without, { id: existing ? existing.id : ('temp-' + student.id), ...payload }];
    });

    const { data, error } = await db.from('atrk_attendance')
      .upsert([payload], { onConflict: 'student_id,date' })
      .select();
    if (error){ console.error(error); toast.fire('Could not update — try again'); loadMarkRecords(); return; }
    if (data && data[0]) setMarkRecords(prev => prev.map(r => r.student_id === student.id ? data[0] : r));
  }

  useEffect(() => { loadStudents(); }, []);

  async function loadStudents(){
    setLoading(true);
    const { data, error } = await db.from('atrk_students').select('*').order('name', { ascending: true });
    setLoading(false);
    if (error){ toast.fire('Could not load students'); console.error(error); return; }
    setStudents(data || []);
  }

  async function handleAddStudent(){
    if (!name.trim() || !roll.trim()) return;
    setSaving(true);
    const { data, error } = await db.from('atrk_students').insert([{ name: name.trim(), roll_no: roll.trim() }]).select();
    setSaving(false);
    if (error){
      if (error.code === '23505') toast.fire(`Roll number ${roll} already exists`);
      else { toast.fire('Could not add student'); console.error(error); }
      return;
    }
    if (data && data[0]) setStudents(prev => [...prev, data[0]].sort((a,b) => a.name.localeCompare(b.name)));
    setName(''); setRoll(''); setAddOpen(false);
    toast.fire(`${name} added`);
  }

  async function handleDeleteStudent(student){
    if (!window.confirm(`Remove ${student.name}? This also clears their attendance history.`)) return;
    const { error } = await db.from('atrk_students').delete().eq('id', student.id);
    if (error){ toast.fire('Could not delete student'); console.error(error); return; }
    setStudents(prev => prev.filter(s => s.id !== student.id));
    toast.fire(`${student.name} removed`);
  }

  async function handleGenerateReport(){
    if (!fromDate || !toDate){ toast.fire('Pick both dates'); return; }
    if (fromDate > toDate){ toast.fire('"From" date must be before "To" date'); return; }
    setGenerating(true);
    const [attRes, holRes] = await Promise.all([
      db.from('atrk_attendance').select('*').gte('date', fromDate).lte('date', toDate),
      db.from('atrk_holidays').select('date').gte('date', fromDate).lte('date', toDate)
    ]);
    setGenerating(false);
    if (attRes.error){ toast.fire('Could not generate report'); console.error(attRes.error); return; }
    if (holRes.error){ console.error(holRes.error); }

    // Holidays are excluded entirely — neither counted as a session nor
    // held against anyone, even if a record accidentally exists for one
    // (e.g. marked before the holiday was declared).
    const holidayDates = new Set((holRes.data || []).map(h => h.date));
    const records = (attRes.data || []).filter(r => !holidayDates.has(r.date));
    const sessionDates = [...new Set(records.map(r => r.date))];
    // Each day = 2 half-day sessions (Morning + Afternoon), per the
    // half-day attendance model.
    const totalHalfDays = sessionDates.length * 2;

    const rows = students.map(s => {
      const mine = records.filter(r => r.student_id === s.id);
      const absentHalf = mine.filter(r => r.morning_status === 'absent').length + mine.filter(r => r.afternoon_status === 'absent').length;
      const odHalf = mine.filter(r => r.morning_status === 'od').length + mine.filter(r => r.afternoon_status === 'od').length;      const unmarkedHalf = mine.reduce((n, r) => n + (r.morning_status === 'unmarked' ? 1 : 0) + (r.afternoon_status === 'unmarked' ? 1 : 0), 0);
      const presentHalf = Math.max(0, totalHalfDays - absentHalf - odHalf - unmarkedHalf);
      const countedHalfDays = totalHalfDays - unmarkedHalf; // Not Marked half-days are excluded, like holidays
      const percentage = countedHalfDays <= 0 ? null : Math.round(((presentHalf + odHalf) / countedHalfDays) * 1000) / 10;
      return {
        ...s,
        present: Math.round((presentHalf / 2) * 10) / 10,
        absent: Math.round((absentHalf / 2) * 10) / 10,
        od: Math.round((odHalf / 2) * 10) / 10,
        percentage
      };
    }).sort((a,b) => rollCompare(a.roll_no, b.roll_no));

    setReport({ fromDate, toDate, totalSessions: sessionDates.length, rows, holidaysExcluded: holidayDates.size });
  }

  async function handleDownloadPDF(){
    if (!report) return;
    if (typeof window.jspdf === 'undefined'){ toast.fire('Could not load PDF tool'); return; }
    setPdfBusy(true);
    try{
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'pt', format: 'a4' });
      const pageWidth = doc.internal.pageSize.getWidth();
      const pageHeight = doc.internal.pageSize.getHeight();
      const marginX = 40;
      const bottomLimit = pageHeight - 56;
      let y = 56;

      doc.setFont('helvetica', 'bold'); doc.setFontSize(19);
      doc.setTextColor(27, 37, 64);
      doc.text('Attendance Report', marginX, y);

      doc.setTextColor(94, 107, 140);
      doc.text(`${formatDisplayDate(report.fromDate)} – ${formatDisplayDate(report.toDate)}  ·  ${report.totalSessions} session${report.totalSessions === 1 ? '' : 's'}`, marginX, y);
      y += 26;

      const cols = [
        { label: 'Name', w: 150, align: 'left' },
        { label: 'Roll', w: 55, align: 'left' },
        { label: 'Present', w: 60, align: 'center' },
        { label: 'Absent', w: 60, align: 'center' },
        { label: 'OD', w: 45, align: 'center' },
        { label: '%', w: 55, align: 'center' }
      ];
      const tableWidth = cols.reduce((s,c) => s + c.w, 0);

      function drawHeader(){
        doc.setFillColor(27, 37, 64);
        doc.rect(marginX, y, tableWidth, 26, 'F');
        let x = marginX;
        doc.setFont('helvetica', 'bold'); doc.setFontSize(10);
        doc.setTextColor(255,255,255);
        cols.forEach(c => {
          doc.text(c.label, c.align === 'left' ? x + 8 : x + c.w/2, y + 17, { align: c.align === 'left' ? 'left' : 'center' });
          x += c.w;
        });
        y += 26;
      }

      drawHeader();
      report.rows.forEach((r, i) => {
        if (y + 24 > bottomLimit){ doc.addPage(); y = 56; drawHeader(); }
        if (i % 2 === 1){ doc.setFillColor(246, 248, 253); doc.rect(marginX, y, tableWidth, 24, 'F'); }
        let x = marginX;
        doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
        doc.setTextColor(27, 37, 64);
        const cells = [r.name, r.roll_no, String(r.present), String(r.absent), String(r.od), r.percentage === null ? '—' : r.percentage + '%'];
        cells.forEach((val, ci) => {
          const c = cols[ci];
          doc.text(String(val), c.align === 'left' ? x + 8 : x + c.w/2, y + 16, { align: c.align === 'left' ? 'left' : 'center' });
          x += c.w;
        });
        y += 24;
      });

      const pageCount = doc.internal.getNumberOfPages();
      for (let p = 1; p <= pageCount; p++){
        doc.setPage(p);
        doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
        doc.setTextColor(154, 166, 196);
        doc.text('Generated by Student Absentees Tracker', marginX, pageHeight - 26);
        doc.text(`Page ${p} of ${pageCount}`, pageWidth - marginX, pageHeight - 26, { align: 'right' });
      }

      doc.save(`attendance-report-${report.fromDate}-to-${report.toDate}.pdf`);
      toast.fire('PDF downloaded');
    }catch(err){
      console.error(err); toast.fire('Something went wrong');

  }

        }
      });

      const buffer = await wb.xlsx.writeBuffer();
      const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const url = URL.createObjectURL(blob);

      document.body.appendChild(a); a.click(); a.remove();

    }catch(err){

    }
  }

                {report.holidaysExcluded > 0 && ` · ${report.holidaysExcluded} holiday${report.holidaysExcluded === 1 ? '' : 's'} excluded`}

              <button className="btn btn-outline" style={{ width:'100%', marginTop:14 }} onClick={handleDownloadPDF} disabled={pdfBusy}>

                Download Excel

}
function AdminDashboard({ session, toast }){
  const { date: today } = useMemo(todayInfo, []);
  const [tab, setTab] = useState('users');
  const [users, setUsers] = useState([]);
  const [students, setStudents] = useState([]);
  const [attendance, setAttendance] = useState([]);
  const [loading, setLoading] = useState(true);
  const [addUserOpen, setAddUserOpen] = useState(false);
  const [resetTarget, setResetTarget] = useState(null);
  const [roleTarget, setRoleTarget] = useState(null);
  const [holidays, setHolidays] = useState([]);
  const [holidayDate, setHolidayDate] = useState('');
  const [holidayReason, setHolidayReason] = useState('');
  const [savingHoliday, setSavingHoliday] = useState(false);

  const [markDate, setMarkDate] = useState(today);
  const [markRecords, setMarkRecords] = useState([]);
  const [markLoading, setMarkLoading] = useState(false);

  const [bulkOpen, setBulkOpen] = useState(false);
  const [bulkFrom, setBulkFrom] = useState(today);
  const [bulkTo, setBulkTo] = useState(today);
  const [bulkSelected, setBulkSelected] = useState({}); // studentId -> true
  const [bulkStatus, setBulkStatus] = useState('present'); // 'present' | 'absent' | 'od' | 'unmark'
  const [bulkRunning, setBulkRunning] = useState(false);

  const [addStudentOpen, setAddStudentOpen] = useState(false);
  const [studentName, setStudentName] = useState('');
  const [studentRoll, setStudentRoll] = useState('');
  const [savingStudent, setSavingStudent] = useState(false);

  const { day: today_day } = useMemo(todayInfo, []);
  const [fromDate, setFromDate] = useState(today);
  const [toDate, setToDate] = useState(today);
  const [report, setReport] = useState(null);
  const [generating, setGenerating] = useState(false);
  const [pdfBusy, setPdfBusy] = useState(false);

  const [todayRecords, setTodayRecords] = useState([]);
  const [listsLoading, setListsLoading] = useState(false);
  const [sharingImg, setSharingImg] = useState(false);
  const [sharingTxt, setSharingTxt] = useState(false);
  const [shareFilter, setShareFilter] = useState('both'); // 'both' | 'morning' | 'afternoon'

  useEffect(() => { loadAll(); }, []);
  useEffect(() => { if (tab === 'mark') loadMarkRecords(markDate); }, [tab, markDate]);
  useEffect(() => { if (tab === 'lists') loadTodayRecords(); }, [tab]);

  async function loadAll(){
    setLoading(true);
    const [u, s, a, h] = await Promise.all([
      db.from('atrk_profiles').select('*').order('email', { ascending: true }),
      db.from('atrk_students').select('*').order('name', { ascending: true }),
      db.from('atrk_attendance').select('*').or('morning_status.not.is.null,afternoon_status.not.is.null').order('date', { ascending: false }).limit(200),
      db.from('atrk_holidays').select('*').order('date', { ascending: true })
    ]);
    if (u.error) console.error(u.error); else setUsers(u.data || []);
    if (s.error) console.error(s.error); else setStudents(s.data || []);
    if (a.error) console.error(a.error); else setAttendance((a.data || []).filter(r => r.morning_status || r.afternoon_status));
    if (h.error) console.error(h.error); else setHolidays(h.data || []);
    setLoading(false);
  }

  async function loadMarkRecords(d){
    setMarkLoading(true);
    const { data, error } = await db.from('atrk_attendance').select('*').eq('date', d);
    setMarkLoading(false);
    if (error){ toast.fire('Could not load attendance for that date'); console.error(error); return; }
    setMarkRecords(data || []);
  }

  const markRecordMap = useMemo(() => {
    const m = {};
    markRecords.forEach(r => { m[r.student_id] = r; });
    return m;
  }, [markRecords]);

  async function markSession(student, session, newStatus){
    const day = dayOfWeek(markDate);
    const existing = markRecordMap[student.id] || null;
    let morning_status = existing ? existing.morning_status : null;
    let afternoon_status = existing ? existing.afternoon_status : null;
    let afternoon_manual = existing ? existing.afternoon_manual : false;

    if (session === 'morning'){
      morning_status = newStatus;
      if (!afternoon_manual) afternoon_status = newStatus;
    } else {
      afternoon_status = newStatus;
      afternoon_manual = true;
    }

    const payload = { student_id: student.id, name: student.name, roll_no: student.roll_no, date: markDate, day, morning_status, afternoon_status, afternoon_manual };

    setMarkRecords(prev => {
      const without = prev.filter(r => r.student_id !== student.id);
      return [...without, { id: existing ? existing.id : ('temp-' + student.id), ...payload }];
    });

    const { data, error } = await db.from('atrk_attendance')
      .upsert([payload], { onConflict: 'student_id,date' })
      .select();
    if (error){ console.error(error); toast.fire('Could not update — try again'); loadMarkRecords(markDate); return; }
    if (data && data[0]) setMarkRecords(prev => prev.map(r => r.student_id === student.id ? data[0] : r));
  }

  async function handleBulkMark(){
    const chosenIds = Object.keys(bulkSelected).filter(id => bulkSelected[id]);
    if (chosenIds.length === 0){ toast.fire('Select at least one student'); return; }
    if (!bulkFrom || !bulkTo || bulkFrom > bulkTo){ toast.fire('Pick a valid date range'); return; }

    const chosen = chosenIds.map(id => students.find(s => s.id === id)).filter(Boolean);
    if (chosen.length === 0){ toast.fire('Student not found'); return; }

    if (bulkStatus === 'unmark'){
      const ok = window.confirm(
        `Set attendance to Not Marked for ${chosen.length === 1 ? chosen[0].name : chosen.length + ' students'} between ${formatDisplayDate(bulkFrom)} and ${formatDisplayDate(bulkTo)}, overwriting any Present/Absent/OD already recorded? This can't be undone.`
      );
      if (!ok) return;
    }

    setBulkRunning(true);

    // Every date from From through To inclusive gets the chosen status,
    // for every selected student. Present, Absent and OD overwrite any
    // previously recorded status, and Not Marked likewise overwrites
    // Present/Absent/OD with an explicit unmarked record (so those days
    // stop counting as Present). Declared holidays are skipped.
    const holidaySet = new Set(holidays.map(h => h.date));
    const dates = [];
    let cursor = parseDateStr(bulkFrom);
    const end = parseDateStr(bulkTo);
    while (cursor <= end){
      const ds = formatDateStr(cursor);
      if (!holidaySet.has(ds)) dates.push(ds);
      cursor = new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate() + 1);
    }
    if (dates.length === 0){
      setBulkRunning(false);
      toast.fire('Every date in that range is a declared holiday');
      return;
    }

    const statusValue = bulkStatus === 'present' ? null : bulkStatus === 'unmark' ? 'unmarked' : bulkStatus;
    const rows = [];
    chosen.forEach(student => {
      dates.forEach(d => {
        rows.push({
          student_id: student.id, name: student.name, roll_no: student.roll_no,
          date: d, day: dayOfWeek(d),
          morning_status: statusValue, afternoon_status: statusValue, afternoon_manual: true
        });
      });
    });

    const { error: upsertErr } = await db.from('atrk_attendance')
      .upsert(rows, { onConflict: 'student_id,date' });
    setBulkRunning(false);
    if (upsertErr){
      // Some servers cap the rows per statement — retry in smaller batches.
      console.error(upsertErr);
      let lastErr = upsertErr;
      let saved = 0;
      for (let i = 0; i < rows.length; i += 200){
        const { error: batchErr } = await db.from('atrk_attendance')
          .upsert(rows.slice(i, i + 200), { onConflict: 'student_id,date' });
        if (batchErr){ console.error(batchErr); lastErr = batchErr; break; }
        saved += Math.min(200, rows.length - i);
      }
      if (saved === 0){ toast.fire('Could not apply bulk marking'); console.error(lastErr); return; }
      toast.fire(`Marked ${saved} of ${rows.length} entr${rows.length === 1 ? 'y' : 'ies'} — retry the rest`);
      if (markDate >= bulkFrom && markDate <= bulkTo) loadMarkRecords(markDate);
      return;
    }

    const who = chosen.length === 1 ? chosen[0].name : chosen.length + ' students';
    const entryCount = chosen.length * dates.length;
    const summary = `${entryCount} entr${entryCount === 1 ? 'y' : 'ies'} (${dates.length} date${dates.length === 1 ? '' : 's'} × ${chosen.length} student${chosen.length === 1 ? '' : 's'})`;
    toast.fire(bulkStatus === 'unmark' ? `Set ${summary} to Not Marked for ${who}` : `Marked ${summary} for ${who}`);

    if (markDate >= bulkFrom && markDate <= bulkTo) loadMarkRecords(markDate);
  }

  const markDateSummary = useMemo(() => {
    const totalHalfDays = students.length * 2;
    let absentHalf = 0, odHalf = 0, unmarkedHalf = 0;
    markRecords.forEach(r => {
      [r.morning_status, r.afternoon_status].forEach(st => {
        if (st === 'absent') absentHalf++;
        else if (st === 'od') odHalf++;
        else if (st === 'unmarked') unmarkedHalf++;
      });
    });
      const presentHalf = Math.max(0, totalHalfDays - absentHalf - odHalf - unmarkedHalf);
    const half = (n) => Math.round((n / 2) * 10) / 10;
    return {
      total: students.length,
      present: half(presentHalf),
      absent: half(absentHalf),
      od: half(odHalf),
      unmarked: half(unmarkedHalf)
    };

  // ---------- Reports + PDF ----------
  async function handleGenerateReport(){
    if (!fromDate || !toDate){ toast.fire('Pick both dates'); return; }
    if (fromDate > toDate){ toast.fire('"From" date must be before "To" date'); return; }
    setGenerating(true);
    const { data, error } = await db.from('atrk_attendance').select('*').gte('date', fromDate).lte('date', toDate);
    setGenerating(false);
    if (error){ toast.fire('Could not generate report'); console.error(error); return; }

    // Holidays are excluded entirely — neither counted as a session nor
    // held against anyone, even if a record accidentally exists for one
    // (e.g. marked before the holiday was declared). Admin already has
    // the full holidays list loaded, so just filter by range locally.
    const holidayDates = new Set(
      holidays.filter(h => h.date >= fromDate && h.date <= toDate).map(h => h.date)
    );
    const records = (data || []).filter(r => !holidayDates.has(r.date));
    const sessionDates = [...new Set(records.map(r => r.date))];
    const totalHalfDays = sessionDates.length * 2;

    const rows = students.map(s => {
      const mine = records.filter(r => r.student_id === s.id);
      const absentHalf = mine.filter(r => r.morning_status === 'absent').length + mine.filter(r => r.afternoon_status === 'absent').length;
      const odHalf = mine.filter(r => r.morning_status === 'od').length + mine.filter(r => r.afternoon_status === 'od').length;      const unmarkedHalf = mine.reduce((n, r) => n + (r.morning_status === 'unmarked' ? 1 : 0) + (r.afternoon_status === 'unmarked' ? 1 : 0), 0);
      const presentHalf = Math.max(0, totalHalfDays - absentHalf - odHalf - unmarkedHalf);
      const countedHalfDays = totalHalfDays - unmarkedHalf; // Not Marked half-days are excluded, like holidays
      const percentage = countedHalfDays <= 0 ? null : Math.round(((presentHalf + odHalf) / countedHalfDays) * 1000) / 10;
      return {
        ...s,
        present: Math.round((presentHalf / 2) * 10) / 10,
        absent: Math.round((absentHalf / 2) * 10) / 10,
        od: Math.round((odHalf / 2) * 10) / 10,
        percentage
      };
    }).sort((a,b) => rollCompare(a.roll_no, b.roll_no));

    setReport({ fromDate, toDate, totalSessions: sessionDates.length, rows, holidaysExcluded: holidayDates.size });
  }

  async function handleDownloadPDF(){
    if (!report) return;
    if (typeof window.jspdf === 'undefined'){ toast.fire('Could not load PDF tool'); return; }
    setPdfBusy(true);
    try{
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'pt', format: 'a4' });
      const pageWidth = doc.internal.pageSize.getWidth();
      const pageHeight = doc.internal.pageSize.getHeight();
      const marginX = 40;
      const bottomLimit = pageHeight - 56;
      let y = 56;

      doc.setFont('helvetica', 'bold'); doc.setFontSize(19);
      doc.setTextColor(27, 37, 64);
      doc.text('Attendance Report', marginX, y);
      y += 20;
      doc.setFont('helvetica', 'normal'); doc.setFontSize(11);
      doc.setTextColor(94, 107, 140);
      doc.text(`${formatDisplayDate(report.fromDate)} – ${formatDisplayDate(report.toDate)}  ·  ${report.totalSessions} session${report.totalSessions === 1 ? '' : 's'}`, marginX, y);
      y += 26;

      const cols = [
        { label: 'Name', w: 150, align: 'left' },
        { label: 'Roll', w: 55, align: 'left' },
        { label: 'Present', w: 60, align: 'center' },
        { label: 'Absent', w: 60, align: 'center' },
        { label: 'OD', w: 45, align: 'center' },
        { label: '%', w: 55, align: 'center' }
      ];
      const tableWidth = cols.reduce((s,c) => s + c.w, 0);

      function drawHeader(){
        doc.setFillColor(27, 37, 64);
        doc.rect(marginX, y, tableWidth, 26, 'F');
        let x = marginX;
        doc.setFont('helvetica', 'bold'); doc.setFontSize(10);
        doc.setTextColor(255,255,255);
        cols.forEach(c => {
          doc.text(c.label, c.align === 'left' ? x + 8 : x + c.w/2, y + 17, { align: c.align === 'left' ? 'left' : 'center' });
          x += c.w;
        });
        y += 26;
      }

      drawHeader();
      report.rows.forEach((r, i) => {
        if (y + 24 > bottomLimit){ doc.addPage(); y = 56; drawHeader(); }
        if (i % 2 === 1){ doc.setFillColor(246, 248, 253); doc.rect(marginX, y, tableWidth, 24, 'F'); }
        let x = marginX;
        doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
        doc.setTextColor(27, 37, 64);
        const cells = [r.name, r.roll_no, String(r.present), String(r.absent), String(r.od), r.percentage === null ? '—' : r.percentage + '%'];
        cells.forEach((val, ci) => {
          const c = cols[ci];
          doc.text(String(val), c.align === 'left' ? x + 8 : x + c.w/2, y + 16, { align: c.align === 'left' ? 'left' : 'center' });
          x += c.w;
        });
        y += 24;
      });

      const pageCount = doc.internal.getNumberOfPages();
      for (let p = 1; p <= pageCount; p++){
        doc.setPage(p);
        doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
        doc.setTextColor(154, 166, 196);
        doc.text('Generated by Student Absentees Tracker', marginX, pageHeight - 26);
        doc.text(`Page ${p} of ${pageCount}`, pageWidth - marginX, pageHeight - 26, { align: 'right' });
      }

      doc.save(`attendance-report-${report.fromDate}-to-${report.toDate}.pdf`);
      toast.fire('PDF downloaded');
    }catch(err){
      console.error(err); toast.fire('Something went wrong');
    }
    setPdfBusy(false);
  }

      });

      const buffer = await wb.xlsx.writeBuffer();
      const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });

  function sessionBlockLines(label, absent, od){
    const lines = [label, `Absent (${absent.length})`];
    if (absent.length === 0) lines.push('None');
    else absent.forEach((a, i) => lines.push(`${String(i+1).padStart(2,'0')}. ${a.name} — Roll ${a.roll_no}`));
    lines.push('', `OD (${od.length})`);
    if (od.length === 0) lines.push('None');
    else od.forEach((a, i) => lines.push(`${String(i+1).padStart(2,'0')}. ${a.name} — Roll ${a.roll_no}`));
    return lines;
  }
